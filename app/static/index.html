/* 两行共用同一套栅格 —— 账户下拉和链接输入框的左边缘才会严丝合缝对齐。
   「音乐平台」放在第 3 列里靠右，于是它跟链接输入框共用同一条右边界，
   中间那截自然就空出来了。 */
.form>label{font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;
  white-space:nowrap}

/* 输入控件的统一底子：任何「漏网」的裸 input 也不会再是浏览器默认的白底 */
input[type=text],input[type=search],input[type=number],input[type=password],
input[type=url],input[type=email],input:not([type]),select,textarea{
  background:var(--field);border:1px solid var(--ctrl);border-radius:6px;
  color:var(--ink);font:inherit;padding:7px 9px;min-width:0;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[type=text]:focus,input[type=search]:focus,input[type=number]:focus,
input[type=password]:focus,input[type=url]:focus,input[type=email]:focus,
input:not([type]):focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);cursor:pointer}
/* 浏览器「自动填充」会给输入框强行刷一层 UA 底色（走 light-dark()，页面没声明
   color-scheme 时一律取浅色 = 白底），而且是 UA 的 !important，作者样式盖不掉。
   上面 :root 里的 color-scheme 已经修掉了根因；这里再用内阴影兜一层，
   保证自动填充后的底色和文字跟主题完全一致。 */
input:-webkit-autofill,input:-webkit-autofill:hover,
input:-webkit-autofill:focus,input:-webkit-autofill:active,
textarea:-webkit-autofill,select:-webkit-autofill{
  -webkit-text-fill-color:var(--ink);
  -webkit-box-shadow:0 0 0 1000px var(--field-solid) inset;
  caret-color:var(--ink);
  transition:background-color 600000s 0s}
.field label{display:block;font-weight:600;font-size:12px;margin-bottom:6px}
.field input,.field select{width:100%;padding:9px;border:1px solid var(--ctrl);

                           font:inherit;backdrop-filter:var(--glass-blur);
                           -webkit-backdrop-filter:var(--glass-blur)}
.field input::placeholder{color:var(--muted)}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue)}
.plats{display:flex;gap:10px;flex-wrap:wrap}
.plat{display:flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid var(--ctrl);
      background:var(--panel);border-radius:8px;cursor:pointer;font-size:13px;user-select:none;

.plat.on{border-color:var(--blue);background:var(--soft);

/* ================= 歌单融合：全页铺满（沉浸式，没有卡片外框） ================= */

  height:100vh;display:flex;flex-direction:column}

  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  align-items:center;font-size:12.5px}

  border-radius:5px;display:block;object-fit:cover;background:var(--g-input)}

.graph-wrap .wires path.hit{stroke:transparent;stroke-width:14;fill:none;
  pointer-events:stroke;cursor:pointer}
/* 悬停：只改鼠标样式 + 让这根线暂时停住（不铺任何背景色） */
.graph-wrap .wires path.wire.hold{animation-play-state:paused}
.graph-wrap .wires path.wire.hold:not(.flow){stroke-width:2.2;opacity:1}
.graph-wrap .wires path.temp{stroke:var(--c1);stroke-width:2;stroke-dasharray:6 5;
  animation:gflow 1s linear infinite;opacity:.95}
.graph-wrap .g-node.dropok{border-color:var(--g-drop-brd);
  box-shadow:0 0 0 1px var(--g-drop-brd);cursor:copy}
.graph-wrap .g-node.drophot{border-color:var(--g-drop-brd);background:var(--g-drop-bg);
  box-shadow:0 0 0 2px var(--g-drop-brd),0 8px 24px -10px var(--g-drop-brd)}
.graph-wrap .g-node.dragging{opacity:.5;border-style:dashed}
/* 拖拽时禁止系统文本选中 / 图标被原生拖动 */
.graph-wrap,.graph-wrap *{user-select:none;-webkit-user-select:none}
.graph-wrap input,.graph-wrap select,.graph-wrap textarea,
.graph-wrap .g-node .rn-in{user-select:text !important;-webkit-user-select:text !important;
  cursor:text}
.graph-wrap .pic{-webkit-user-drag:none;user-drag:none}
body.fullbleed{user-select:none;-webkit-user-select:none}

/* 统一弹窗：居中、跟图谱同一套配色 */
.graph-wrap .g-modal{padding:24px;backdrop-filter:blur(7px) saturate(130%);
  -webkit-backdrop-filter:blur(7px) saturate(130%)}
.graph-wrap .g-modal .box{background:var(--g-box);
  border:1px solid var(--g-box-brd);border-radius:14px;padding:20px;width:min(520px,100%);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:0 26px 64px -20px var(--shadow),0 0 0 1px var(--g-box-hi) inset;
  animation:gpop .16s ease-out}
@keyframes gpop{from{transform:translateY(10px) scale(.98);opacity:0}}
.graph-wrap .g-modal h4{font-size:15.5px}
.graph-wrap .g-modal ul.g-list{list-style:none;margin:12px 0 0;padding:0;
  border:1px solid var(--g-list-brd);border-radius:9px;overflow:hidden}
.graph-wrap .g-modal ul.g-list li{display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-bottom:1px solid var(--g-list-sep);background:var(--g-list-bg);
  font-size:12.5px}
.graph-wrap .g-modal ul.g-list li:last-child{border-bottom:0}
.graph-wrap .g-modal ul.g-list img{width:18px;height:18px;border-radius:5px;flex:none}
.graph-wrap .g-modal ul.g-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.graph-wrap .g-modal ul.g-list .pl{margin-left:auto;color:var(--g-muted);font-size:11.5px;
  flex:none}
.graph-wrap .g-modal .tagnew{background:var(--g-new-bg);color:var(--g-new-ink);
  border:1px solid var(--g-new-brd);border-radius:99px;padding:1px 8px;font-size:11px;flex:none}
.graph-wrap .g-ok{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--g-ok-bg);
  border:1px solid var(--g-ok-brd);color:var(--g-ok-ink);font-size:12.5px;line-height:1.65}
.graph-wrap .g-ok b{color:var(--g-ok-bold)}
.graph-wrap .g-danger{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--g-err-bg);
  border:1px solid var(--g-err-brd);color:var(--g-err-ink);font-size:12.5px;line-height:1.65}
/* ================= 通用弹窗（浅色/暗色都跟着主题走） ================= */
#amodal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:24px;background:var(--scrim);backdrop-filter:blur(7px) saturate(130%);
  -webkit-backdrop-filter:blur(7px) saturate(130%)}
#amodal.on{display:flex}
#amodal .abox{background:var(--popover);border:1px solid var(--edge);border-radius:14px;
  padding:20px;width:min(500px,100%);
  box-shadow:0 26px 64px -22px var(--shadow),0 1px 0 var(--glass-hi) inset;
  backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);
  animation:apop .16s ease-out}
@keyframes apop{from{transform:translateY(10px) scale(.98);opacity:0}}
#amodal h4{margin:0;font-size:16px}
#amodal .mh{color:var(--muted);font-size:13px;margin-top:9px;line-height:1.65}
#amodal .row{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
#amodal .mh code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:12px;
  border:1px solid var(--line)}

/* 连线端口：只有拖它才连线，点击热区比看到的圆点大 */
.graph-wrap .g-node .port{width:9px;height:9px;margin-top:-4.5px;background:var(--g-port);
  border:1px solid var(--g-port-brd);cursor:crosshair;
  transition:background .15s,border-color .15s}
/* 热区只往「节点外面」和上下扩，别去抢节点本体的悬停 */
/* 热区只往「节点外面」扩：左节点的圆点往右扩，右节点的圆点往左扩 */
.graph-wrap .g-node.left .port::after{content:'';position:absolute;top:-11px;bottom:-11px;
  left:0;right:-13px}
.graph-wrap .g-node.right .port::after{content:'';position:absolute;top:-11px;bottom:-11px;
  left:-13px;right:0}
.graph-wrap .g-node.left .port{right:-4.5px}
.graph-wrap .g-node.right .port{left:-4.5px;cursor:default}
.graph-wrap .g-node.right:hover .port{border-color:var(--g-port-hover)}
.graph-wrap .g-node.left:hover .port{background:var(--g-port-hover-bg);
  border-color:var(--g-port-hover)}
.graph-wrap .g-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--g-list-brd)}
.graph-wrap .g-actions .lbl{color:var(--g-muted);font-size:12px;margin-right:auto}
/* 工具栏右侧这三个入口先藏起来（「新增融合组 / 添加来源 / 任务日志」）。
   想恢复：把下面这行的 `.gt-hide` 去掉（或者把 HTML 里对应的 class 删掉）即可，
   markup 和事件都还在，JS 不会报错。 */
.graph-wrap .gt-hide{display:none !important}
/* 「未接入」的飞牛歌单：灰色虚线，拖个来源过来就纳管 */
.graph-wrap .g-node.right.untracked{border-style:dashed;border-color:var(--g-unt-brd);
  background:var(--g-unt-bg);color:var(--g-unt-ink)}
/* 「勾了但还没同步」的来源：同样用虚线，一眼看出它还没建出来 */
.graph-wrap .g-node.left.pending{border-style:dashed;border-color:var(--g-unt-brd);
  background:var(--g-unt-bg);color:var(--g-unt-ink)}
.graph-wrap .g-node.left.pending .nm{color:var(--g-unt-ink)}
.graph-wrap .g-node.left.pending:hover{border-color:var(--g-unt-hover);color:var(--g-unt-hover-ink)}
.graph-wrap .g-node.left.pending:hover .nm{color:var(--g-unt-hover-ink)}
/* 平台上已经删掉的来源：虚线 + 告警红，右上角一个 ✕ 直接摘掉 */
.graph-wrap .g-node.left.missing{border-style:dashed;border-color:var(--g-miss-brd);
  background:var(--g-miss-bg);color:var(--g-miss-ink)}
.graph-wrap .g-node.left.missing .nm{color:var(--g-miss-ink)}
.graph-wrap .g-node.left.missing .tag{background:var(--g-miss-bg);
  border-color:var(--g-miss-brd);color:var(--g-miss-ink)}
.graph-wrap .g-node.left.missing:hover{border-color:var(--g-miss-hover)}
.graph-wrap .g-node.left.missing:hover .nm{color:var(--g-miss-hover)}
.graph-wrap .g-node.left .xdel{position:absolute;top:-8px;right:-8px;width:18px;height:18px;
  display:none;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;
  background:var(--g-miss-hover);color:#1a1012;font-size:11px;line-height:1;font-weight:700;
  border:0;padding:0}
.graph-wrap .g-node.left.missing:hover .xdel{display:flex}
.graph-wrap .g-node.left .xdel:hover{transform:scale(1.12)}
.graph-wrap .g-node.right.untracked .nm{color:var(--g-unt-ink)}
.graph-wrap .g-node.right.untracked:hover{border-color:var(--g-unt-hover);
  color:var(--g-unt-hover-ink)}
.graph-wrap .g-node.right.untracked:hover .nm{color:var(--g-unt-hover-ink)}
.graph-wrap .g-node.right.untracked.hot{border-color:var(--g-port-hover);
  box-shadow:0 0 0 1px var(--g-port-hover)}
.graph-wrap .g-node .tag{background:var(--g-tag-bg);color:var(--g-tag-ink);
  border:1px solid var(--g-tag-brd);border-radius:99px;padding:1px 7px;font-size:10.5px;
  flex:none;margin-left:6px}
.graph-wrap .g-modal code{background:var(--g-code);border:1px solid var(--g-code-brd);
  border-radius:4px;padding:1px 5px;font:11.5px/1.5 ui-monospace,Menlo,monospace;
  color:var(--g-code-ink);word-break:break-all}
@media(max-width:900px){.side{width:180px}.grid{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}}
/* 表单窄了就改成一行一项，不然 5 列挤不下会横向溢出 */
@media(max-width:860px){
  .form{grid-template-columns:1fr;row-gap:8px}
  .form>*{grid-area:auto !important}
  .form>label{text-align:left}
  .f-plat{justify-content:flex-start}
}
@media(max-width:680px){.app{display:block}.side{width:auto;padding:10px}
  .brand{padding:8px}.nav{display:flex;overflow:auto}.content{padding:16px}
  .grid{grid-template-columns:1fr}.title{display:block}
  .grp-row{grid-template-columns:26px 1fr}.grp-row input{grid-column:2}}
@media(max-width:680px){
  .sidebar-modern .side{height:auto;min-height:0;position:sticky;top:0;z-index:90;overflow:visible;padding:8px 10px;background:var(--side)}
  .sidebar-modern .brand{align-items:center;padding:2px 4px 8px}
  .sidebar-modern .brand-copy{font-size:15px}.sidebar-modern .brand-copy small{display:none}
  .sidebar-modern .side-foot{position:relative;right:auto;top:auto;margin-top:0;padding:0;border-top:1px solid var(--edge);justify-content:stretch}
  .sidebar-modern .side-foot .theme-tg{position:absolute;right:42px;bottom:17px}
  /* 窄屏侧栏变成顶部横条，贴着右边框的把手会飘到内容上：改成右上角的小方按钮，排在主题按钮左边 */
  .sidebar-collapse-tab{left:auto;right:52px;top:13px;transform:none;width:34px;height:34px;border:1px solid var(--edge);border-radius:9px;background:transparent;box-shadow:none}
  .app.side-collapsed .sidebar-collapse-tab{left:auto;right:52px}
  .app.side-collapsed .sidebar-modern .side-foot{position:relative;right:auto;top:auto;justify-content:stretch}
  .app.side-collapsed .sidebar-modern .side-foot .theme-tg{right:42px;bottom:17px}
  .sidebar-modern .nav{display:flex;overflow-x:auto;gap:4px;padding:2px 0 1px;scrollbar-width:none}
  .sidebar-modern .nav::-webkit-scrollbar{display:none}
  .sidebar-modern .nav button,.sidebar-modern .nav .music-entry{width:auto;min-width:max-content;min-height:36px;padding:7px 9px;font-size:12px}
  .sidebar-modern .nav button svg,.sidebar-modern .nav .music-entry svg{width:15px;height:15px}
  .app.side-collapsed .side{width:auto;height:auto;padding:8px 10px}
  .app.side-collapsed .brand{justify-content:space-between;padding:2px 4px 0}
  .app.side-collapsed .brand-copy{display:block}.app.side-collapsed .brand-mark{display:none}
  .app.side-collapsed .nav{display:none}
  .sidebar-modern .side-account-wrap{margin-top:6px;padding:6px 0}
    .app.side-collapsed .side-account-wrap{margin-top:4px}
  .app.side-collapsed .side-account-label{display:block}
  .app.side-collapsed .side-account>svg{display:block}
  .app.side-collapsed .side-foot{justify-content:stretch}
}

/* ===================== 歌单同步：两个大分组 ===================== */
/* 标题 + 内容合成【一张】卡片，不然「标题条 + 卡片」看着像两组，一页像四组。
   ⚠️ 这里**不能**用 overflow:hidden ——「飞牛音乐账户」的下拉菜单是绝对定位的浮层，
   卡片一裁就把菜单切掉了（只能看到两三行）。圆角改成由标题条自己带。 */
.sec{margin-bottom:22px;background:var(--panel);border:1px solid var(--edge);
  border-radius:14px;position:relative;
  box-shadow:0 16px 44px -32px var(--shadow),0 1px 0 var(--glass-hi) inset;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
/* 账户下拉展开时，把这张卡片抬到兄弟卡片上面 —— 否则伸出去的菜单会被下面的
   「歌单列表」盖住。`.sec` 有 backdrop-filter，自成一个层叠上下文，
   菜单自己的 z-index 出不了这张卡片，只能抬卡片本身。
   取 15：高过兄弟卡片（auto = 0），又低于底部日志抽屉（20）和弹窗（60）。 */
.sec.raised{z-index:15}
.sec-hd{display:flex;align-items:center;gap:12px;padding:13px 16px 13px 16px;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;transition:.15s;
  border-radius:13px 13px 0 0}
.sec.fold .sec-hd{border-radius:13px;border-bottom:0}
.sec-hd:hover{background:var(--hover-bg)}
.sec-hd h2{margin:0;font-size:16.5px;letter-spacing:.3px}
.sec-hd::before{content:"";width:3px;height:18px;border-radius:2px;flex:none;
  background:var(--blue);opacity:.6}
.sec-hd .sec-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.sec-bd{padding:18px}
.sec.fold .sec-hd{border-bottom:0}
.sec.fold .sec-bd{display:none}
/* 分组内部不再套第二层卡片 —— 一整块就是一个整体 */
.sec .card{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
/* 图标按钮：刷新转一圈、收起展开是个箭头 */
.ibtn{width:34px;height:34px;padding:0;display:grid;place-items:center;flex:none;
  border:1px solid var(--ctrl);background:var(--panel);color:var(--muted);
  border-radius:9px;cursor:pointer;transition:.15s;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.ibtn:hover{color:var(--blue);border-color:var(--blue);background:var(--hover-bg)}
/* 键盘走查时给一个干净的聚焦圈，鼠标点则不显示（浏览器默认那圈太糙） */
.ibtn:focus,.btn:focus,.acct-tab:focus,.dd-btn:focus{outline:none}
.ibtn:focus-visible,.btn:focus-visible,.acct-tab:focus-visible,.dd-btn:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
/* 图标本身是「朝下的箭头」：展开时朝下，收起时转成朝右（▶） */
.ibtn .chev{transform:rotate(0deg)}
.sec.fold .ibtn .chev{transform:rotate(-90deg)}
.ibtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 原生 select 做不出「两列对齐」，这里自己画一个 */
.dd{position:relative}
.dd-btn{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 76px 14px;align-items:center;
  gap:8px;padding:8px 10px;border:1px solid var(--ctrl);border-radius:6px;
  background:var(--field);color:var(--ink);font:inherit;cursor:pointer;text-align:left;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.dd-btn:hover{border-color:var(--blue)}
.dd-btn .dd-nm,.dd-item .dd-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13.5px}
.dd-btn .dd-st,.dd-item .dd-st{display:flex;justify-content:flex-start}
.dd-arw{width:11px;height:11px;justify-self:end;border-right:1.6px solid var(--muted);
  border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);
  transition:.16s}
.dd.open .dd-arw{transform:rotate(-135deg) translate(-2px,-2px)}
/* 浮层（下拉菜单）没有遮罩垫底，必须够实才读得清，只保留一点点玻璃感 */
.dd-menu{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:12;display:none;
  background:var(--popover);border:1px solid var(--popover-brd);border-radius:10px;padding:5px;
  box-shadow:0 26px 60px -18px var(--shadow),0 2px 8px -4px var(--shadow),
             0 1px 0 var(--glass-hi) inset;
  backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
  max-height:min(430px,62vh);overflow:auto;
  }
.dd.open .dd-menu{display:block}
.dd-item{display:grid;grid-template-columns:minmax(0,1fr) 76px;align-items:center;gap:8px;
  padding:7px 9px;border-radius:6px;cursor:pointer;font-size:13px}
.dd-st .pill{font-size:11px;padding:1px 7px}      /* 200px 宽的浮层里，状态徽章也收小 */

/* ============ 手动同步的进度条（贴在「歌单列表」卡片头下面一条） ============ */
/* 用负边距顶掉 .sec-bd 的内边距，让它横贯整张卡片 */
.prog{display:flex;align-items:center;gap:12px;margin:-18px -18px 14px;
  padding:10px 16px;background:var(--panel2);border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--muted);animation:pgdrop .22s ease-out}
@keyframes pgdrop{from{opacity:0;transform:translateY(-6px)}}
.prog[hidden]{display:none}
.prog .pdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--blue);
  animation:pgping 1.4s ease-out infinite}
@keyframes pgping{0%{box-shadow:0 0 0 0 rgba(77,141,255,.45)}
                  70%,100%{box-shadow:0 0 0 9px rgba(77,141,255,0)}}
.prog .lbl{color:var(--ink);font-weight:600;white-space:nowrap}
.prog .track{flex:1;min-width:80px;height:6px;border-radius:99px;overflow:hidden;
  background:var(--sw-off);position:relative}
.prog .track i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--blue),#7fb0ff);
  box-shadow:0 0 10px -2px var(--blue);transition:width .28s ease}
.prog .track.indet i{width:34%;animation:pgslide 1.15s ease-in-out infinite}
.prog .meta{white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.prog .pct{white-space:nowrap;font-weight:600;color:var(--ink);min-width:46px;
  text-align:right;font-variant-numeric:tabular-nums}
.prog.done .pdot{background:var(--green);animation:none}
.prog.done .track i{background:var(--green);box-shadow:0 0 10px -2px var(--green)}
.prog.done .pct{color:var(--green)}
.prog.fail .pdot{background:var(--err-ink);animation:none}
.prog.fail .track i{background:var(--err-ink);box-shadow:none}
.prog.fail .pct{color:var(--err-ink)}
/* 正在写的那一行：淡淡高亮，状态位改成「写入 62%」 */
.prow.live{background:var(--soft)}
.prow.live .nm{color:var(--ink);font-weight:600}
.prow.live .mk{color:var(--blue);opacity:1;font-weight:600}
.dd-item:hover{background:var(--hover-bg)}
.dd-item.on{background:var(--soft);box-shadow:0 0 0 1px var(--blue) inset}

/* 「歌单列表」：账户标签按钮 + 按平台折叠 */
.header-account-dd{width:178px;flex:none}
.header-account-dd .dd-btn{grid-template-columns:minmax(0,1fr) 76px 14px;padding:7px 10px;border-radius:9px}
.header-account-dd .dd-menu{min-width:100%}
.graph-wrap .header-account-dd{width:180px}
.sec-tools .header-account-dd{width:168px}
.header-account-dd.disabled{opacity:.6;pointer-events:none}
.acct-tab{display:flex;align-items:center;gap:8px;padding:7px 15px;border-radius:99px;
  border:1px solid var(--ctrl);background:var(--panel);color:var(--ink);cursor:pointer;
  font:inherit;font-size:13px;transition:.14s;
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.acct-tab:hover{border-color:var(--blue);background:var(--hover-bg)}
.acct-tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pgrp{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:10px;
  background:var(--panel2)}
.pgrp:last-child{margin-bottom:0}
.pgrp-hd{display:grid;grid-template-columns:24px minmax(0,1fr) 120px 90px 76px 24px;align-items:center;column-gap:12px;padding:11px 14px;cursor:pointer;
  background:var(--panel2);user-select:none}
.pgrp-hd .grow{display:none}

</button>
<button type="button" class="theme-tg theme-fab" id="theme-tg" onclick="toggleTheme()" title="切换到明亮模式" aria-label="切换到明亮模式"><span id="theme-ic" style="display:flex"></span></button>
<main class="main">
<div class="content">

<section id="p-dashboard" class="page on">
  <button class="ibtn dash-refresh-fab" id="dash-refresh-fab" title="刷新总览数据" aria-label="刷新总览数据" onclick="load()"><svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.6 4.4v4.5h-4.5"/></svg></button>
  <div id="stats" class="dash-grid"></div>
  <div class="dashboard-columns">
    <div class="dashboard-column playlist-column">
      <div class="dashboard-column-title"><span>歌单数据</span></div>

      <div class="card dash-card"><div class="dash-card-head"><h3>歌单已有歌曲占比</h3><select id="dash-match-account" onchange="DASH_MATCH_USER=this.value;renderDashboard()"></select></div><div id="dash-matching" class="dash-match-list"></div></div>
      <div class="card dash-card"><div class="dash-card-head"><h3>歌单来源</h3><select id="dash-source-account" onchange="DASH_SOURCE_USER=this.value;renderDashboard()"></select></div><div id="dash-playlist-sources" class="dash-donut-row"></div></div>
    </div>
    <div class="dashboard-column comment-column">
      <div class="dashboard-column-title"><span>评论数据</span></div>
      <div class="card dash-card"><h3>评论来源</h3><div id="dash-comment-source" class="dash-donut-row"></div></div>
      <div class="card dash-card"><h3>评论歌曲覆盖</h3><div id="dash-comment-coverage" class="dash-donut-row"></div></div>
      <div class="card dash-card"><h3>单曲评论数量分布</h3><div id="dash-comment-buckets"></div></div>
    </div>
  </div>
</section>

<section id="p-sync" class="page">
  <!-- ① 添加来源 -->
  <div class="sec" id="sec-src">
    <div class="sec-hd" onclick="toggleSec('src')">
      <h2>添加来源</h2>
      <div class="sec-tools">
        <button class="ibtn fold-btn" onclick="event.stopPropagation();toggleSec('src')" title="收起 / 展开">
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="sec-bd">
      <!-- 两行是同一套栅格（见 .form）：账户下拉和链接输入框左右都对齐 -->
      <div class="form">
        <label class="f-acc">飞牛音乐账户</label>
        <div class="dd f-dd" id="wu-dd">
          <button type="button" class="dd-btn" onclick="toggleUserDD(event)">
            <span class="dd-nm" id="wu-nm">读取中…</span>
            <span class="dd-st" id="wu-st"></span>
            <span class="dd-arw"></span></button>
          <div class="dd-menu" id="wu-menu"></div>
        </div>
        <div class="f-plat">
          <label>音乐平台</label>
          <div class="plats" id="wp"></div>
        </div>
        <label class="f-lb">音乐平台链接</label>

          <button class="btn primary f-go" onclick="fetchPlaylists()">获取歌单</button>
          <span id="kugou-qr-login" class="kugou-login-entry" hidden>

            <span id="kugou-login-account" class="hint" role="status"></span>
          </span>
        </span>
        <button class="btn f-reset" onclick="buildWizard()">重置</button>
      </div>
      <div id="resolve-box" style="margin-top:16px"></div>
    </div>
  </div>

  <!-- ② 歌单列表 -->
  <div class="sec" id="sec-list">
    <div class="sec-hd" onclick="toggleSec('list')">
      <h2>歌单列表</h2>
      <div class="sec-tools">
        <div class="dd header-account-dd" id="list-account-dd">
          <button type="button" class="dd-btn" onclick="toggleHeaderDD(event,'list')"><span class="dd-nm" id="list-account-name">选择账户</span><span class="dd-st" id="list-account-status"></span><span class="dd-arw"></span></button>
          <div class="dd-menu" id="list-account-menu"></div>
        </div>
        <button class="btn sm" id="list-sync" onclick="event.stopPropagation();syncCurrent()">手动同步</button>
        <button class="btn sm" id="list-auto" onclick="event.stopPropagation();openAutoModal()">自动同步</button>
        <button class="ibtn" id="list-refresh" onclick="event.stopPropagation();loadList(true)" title="重新抓取平台歌单清单">
          <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/>
            <path d="M20.6 4.4v4.5h-4.5"/></svg>
        </button>
        <button class="ibtn fold-btn" onclick="event.stopPropagation();toggleSec('list')" title="收起 / 展开">
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="sec-bd">
      <!-- 同步进度条：跑手动同步时从卡片头下面滑出来，跑完自己收回去 -->

        <span class="pdot"></span>
        <span class="lbl" id="pg-lbl"></span>
        <span class="track"><i id="pg-fill"></i></span>
        <span class="meta" id="pg-meta"></span>
        <span class="pct" id="pg-pct"></span>
      </div>
      <div id="list-body"></div>
    </div>
  </div>
</section>

<section id="p-merge" class="page">
  <div class="graph-wrap" id="graph-wrap">
    <div class="graph-top">
      <div class="g-stat"><b id="g-src">0</b>来源歌单</div>

        <button type="button" class="dd-btn" onclick="toggleHeaderDD(event,'merge')"><span class="dd-nm" id="merge-account-name">全部账户</span><span class="dd-st"></span><span class="dd-arw"></span></button>

      <button class="g-btn ico on" id="g-bflow" onclick="toggleFlow()"></button>
      <button class="g-btn ico" id="g-bfit" onclick="fitGraph(true)"></button>
      <button class="g-btn ico on" id="g-sort" onclick="toggleSort()"></button>
      <button class="g-btn ico" id="g-breset" onclick="resetOrder()"></button>
      <span class="gt-sep gt-hide"></span>
      <button class="g-btn ico primary gt-hide" id="g-bgroup-new" onclick="openGroupForm()"></button>
      <button class="g-btn wide primary gt-hide" id="g-bsrc" onclick="openSrcForm()"></button>
      <button class="g-btn ico gt-hide" id="g-bjobs" onclick="toggleJobs()"></button>
    </div>
    <div class="stage" id="stage">
      <div class="viewport" id="viewport">
        <svg class="wires" id="wires"></svg>
      </div>

      <div class="g-legend">
        <div><i style="background:#39415a;border-top:1px dashed #39415a"></i>未接入（拖来源歌单到这里连接）</div>
        <div><i style="background:#4d8dff"></i>一对一映射</div>
        <div><i style="background:#ffb454"></i>多对一（融合进同一歌单）</div>
        <div style="opacity:.6"><i style="background:#39415a"></i>未映射 / 未同步</div>
        <div style="opacity:.85"><i style="background:#c08b93;border-top:1px dashed #c08b93"></i>源已删除（悬停点 ✕ 摘掉）</div>

      <div class="g-dbg" id="g-dbg"></div>
      <div class="g-toast" id="g-toast"></div>
      <div class="g-modal" id="g-modal"><div class="box" id="g-box"></div></div>
    </div>
  </div>
</section>

<section id="p-comments" class="page">

        <label class="comment-param">来源<select id="cm-plat" onchange="this.dataset.touched='1'"><option value="">全部平台</option><option value="netease">网易云音乐</option><option value="qq">QQ音乐</option><option value="kugou">酷狗音乐</option></select></label>

      </div>
      <div class="comment-plan">
        <label class="switch compact-switch"><button class="sw" id="cm-sw" onclick="cmToggle()"></button><span>定时抓取</span></label>

        <button class="btn sm" onclick="cmSavePlan()">保存</button>
      </div>
    </div>
    <div class="hint" id="cm-msg"></div><div class="hint" id="cm-plan-msg"></div>
  </div>
  <div class="card compact-card cm-progress-card" style="margin-top:14px"><h3>评论数据进度</h3><div id="cm-progress"></div></div>
  <details class="card compact-card task-history" style="margin-top:14px"><summary>任务记录 <span id="tk-count" class="hint"></span></summary><div id="tk-list" class="hint">正在读取…</div></details>
</section>



</div></main></div>

function curTheme(){
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}

function applyTheme(t){
  t = (t === 'light') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  const ic = $('#theme-ic');
  if (ic) ic.innerHTML = (t === 'dark') ? SUN_SVG : MOON_SVG;
  const tg = $('#theme-tg');
  if (tg) { const label=(t === 'dark') ? '切换到明亮模式' : '切换到暗色模式'; tg.title=label; tg.setAttribute('aria-label',label); }
  try { localStorage.setItem('fnm.theme', t); } catch(e) {}
}

function toggleTheme(){
  applyTheme(curTheme() === 'dark' ? 'light' : 'dark');
}
function toggleSidebar(){
  const app=$('.app');if(!app)return;
  const collapsed=app.classList.toggle('side-collapsed');
  const btn=$('#sidebar-toggle'),label=collapsed?'展开侧边栏':'收起侧边栏';
  if(btn){btn.title=label;btn.setAttribute('aria-label',label);btn.setAttribute('aria-expanded',collapsed?'false':'true');}
  try{localStorage.setItem('fnm.sidebarCollapsed',collapsed?'1':'0');}catch(e){}
}
function applySidebarState(){
  let collapsed=false;try{collapsed=localStorage.getItem('fnm.sidebarCollapsed')==='1';}catch(e){}
  const app=$('.app'),btn=$('#sidebar-toggle');if(app)app.classList.toggle('side-collapsed',collapsed);
  if(btn){const label=collapsed?'展开侧边栏':'收起侧边栏';btn.title=label;btn.setAttribute('aria-label',label);btn.setAttribute('aria-expanded',collapsed?'false':'true');}
}

function show(p){
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.page === p));
  $$('.page').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  document.body.classList.toggle('fullbleed', p === 'merge');
  if (p === 'sync') renderSync();
  if (p === 'merge') renderMerge();
  if (p === 'comments') renderComments();
}
$$('.nav button').forEach(b => b.onclick = () => show(b.dataset.page));

});

/* 通用弹窗：取代原生 alert / confirm（浅色页面） */
let ADLG = null;
function aClose(){
  $('#amodal').classList.remove('on');
  $('#abox').innerHTML = '';
  const f = ADLG; ADLG = null;
  if (f) f(false);
}
function aAsk(o){
  return new Promise(resolve => {
    let settled = false;
    const finish = v => { if (settled) return; settled = true; resolve(v); };
    ADLG = finish;
    $('#abox').innerHTML = `<h4>${esc(o.title || '请确认')}</h4>`
      + (o.html ? `<div class="mh">${o.html}</div>` : '')
      + `<div class="row">`
      + (o.cancel === null ? ''
          : `<button class="btn" id="a-no">${esc(o.cancel || '取消')}</button>`)
      + `<button class="btn primary" id="a-yes">${esc(o.ok || '确定')}</button></div>`;
    $('#amodal').classList.add('on');
    setTimeout(() => { const b = $('#a-yes'); if (b && b.focus) b.focus(); }, 30);
    $('#a-yes').onclick = () => { ADLG = null; aClose(); finish(true); };
    const no = $('#a-no');
    if (no) no.onclick = () => { ADLG = null; aClose(); finish(false); };
  });
}
const aAlert = (title, html, ok) =>
  aAsk({title: title, html: html, ok: ok || '知道了', cancel: null});
$('#amodal').addEventListener('click', e => { if (e.target.id === 'amodal') aClose(); });
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const dd = $('#wu-dd');
  if (dd && dd.classList.contains('open')) { setUserDDOpen(false); return; }
  if ($('#amodal').classList.contains('on')) aClose();
});

async function api(u, o){
  // 统一给管理写请求带 CSRF。旧歌单/设置操作仍调用 api(..., {method:'POST'})，
  // 若只保护新任务中心，这些原有按钮在鉴权开启后会全部返回 401。
  const opt = o ? {...o} : {};
  const method = String(opt.method || 'GET').toUpperCase();
  if (['POST','PUT','PATCH','DELETE'].includes(method) &&
      u.startsWith('/api/') && !['/api/login','/api/logout'].includes(u)){
    const headers = new Headers(opt.headers || {});
    const csrf = (typeof SESSION !== 'undefined' && SESSION && SESSION.csrf) || '';
    if (csrf) headers.set('X-Bridge-CSRF', csrf);
    opt.headers = headers;
  }
  const r = await fetch(u, opt);
  const d = await r.json();
  if (!r.ok){
    if (r.status === 401 && u.startsWith('/api/') && typeof loadSession === 'function') {
      await loadSession();
      if (u.startsWith('/api/platform-login/kugou/') && !u.endsWith('/cancel')) showKugouAdminLogin();
    }
    const error = Error(d.error || '请求失败'); error.status = r.status; throw error;
  }
  return d;
}

/* ------------------------------------------------------------------
   评论聚合（commenthub）：同源反代到进程内的只读 API，见方案 §38 / §46
   - 只读：这里没有任何写库动作，抓取由宿主 cron 跑 refresh_v2.py
   - 所有请求都带 /commenthub 前缀；桥接层会剥掉前缀再转给内部 8770
------------------------------------------------------------------ */
let CH_STATS = null;
const CH_SRC = {netease:'网易云', qq:'QQ音乐', kugou:'酷狗', kuwo:'酷我'};

function chEsc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function chApi(path, opt){
  const r = await fetch('/commenthub' + path, opt);
  let d = null;
  try { d = await r.json(); } catch(e) {}
  if (!r.ok){
    const msg = (d && d.error && (d.error.message || d.error)) ||
                (d && (d.reason || d.error)) || ('HTTP ' + r.status);
    throw Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
  }
  return d;
}

function cmRenderRunProgress(active){
  const total = Math.max(0, Number(active.total)||0);
  const done = Math.max(0, Math.min(Number(active.done)||0, total));
  const pct = total ? Math.round(done / total * 100) : 0;
  const song = active.status === 'running' && !active.next_attempt_at && active.song_name
    ? `<div class="cm-run-stat cm-run-song"><span>当前歌曲</span><strong title="${esc(active.song_name)}">${esc(active.song_name)}</strong></div>` : '';
  const rowsNew = Math.max(0, Number(active.rows_new)||0);
  const rowsUpdated = Math.max(0, Number(active.rows_updated)||0);
  const skipped = Math.max(0, Number(active.skipped)||0);
  const failed = Math.max(0, Number(active.failed)||0);
  const stat = (label,value,cls='') => `<div class="cm-run-stat ${cls}"><span>${label}</span><strong>${Number(value||0).toLocaleString()}</strong></div>`;
  const names = {netease:'网易云',qq:'QQ音乐',kugou:'酷狗'};
  const pairs = active.platform_counts || {};
  const rows = Object.entries(pairs).map(([src,n])=>`<tr><th>${names[src]||esc(src)}</th><td>${Number(n.satisfied)||0}</td><td>${Number(n.exhausted)||0}</td><td>${Number(n.unresolved)||0}</td><td>${Number(n.blocked)||0}</td></tr>`).join('');
  const platform = active.target_count && rows ? `<details class="cm-platform-summary"><summary>平台达标情况 <span>每平台目标 ${Number(active.target_count)||0} 条</span></summary><div class="cm-platform-scroll"><table><thead><tr><th>平台</th><th>达标</th><th>抓尽但不足</th><th>未匹配</th><th>受阻</th></tr></thead><tbody>${rows}</tbody></table></div></details>` : '';
  const retry = active.next_attempt_at ? `<div class="hint">等待第 ${Number(active.attempt_count || 0)+1} 次尝试 · ${esc(tkFmtTime(active.next_attempt_at))}；${esc(active.retry_reason || '')}</div>` : '';
  return `<div class="cm-progress-line"><div class="cm-progress-track"><i style="width:${pct}%"></i></div><span class="cm-progress-count">${done} / ${total}</span><strong class="cm-progress-percent">${pct}%</strong></div><div class="cm-run-stats">${stat('新增评论',rowsNew,'new')}${stat('更新评论',rowsUpdated)}${stat('跳过歌曲',skipped,'muted')}${stat('失败歌曲',failed,failed?'bad':'muted')}${song}</div>${platform}${retry}`;

/* 字节数人话化：底盘 1024，保留一位小数；超过 TB 就停在 TB。 */
function fmtBytes(n){
  const b = Number(n);
  if (!Number.isFinite(b) || b < 0) return null;
  const units = ['B','KB','MB','GB','TB'];
  let i = 0, v = b;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? String(Math.round(v)) : (v >= 100 ? v.toFixed(0) : v.toFixed(1))) + ' ' + units[i];
}
function cmRenderKpis(p){
  if (p && p.available) {
    CM_SAVED_STATS = p;
    try { localStorage.setItem('fnm.commentStats.v1', JSON.stringify(p)); } catch(e) {}
  }
  const stats = p && p.available ? p : CM_SAVED_STATS;
  const d=S._commentStats||{},ratio=stats ? Number(stats.coverage_percent||0)/100 : null;
  const storage=(stats&&stats.storage)||null;
  const size=storage?fmtBytes(storage.bytes):null;
  const totalSongs=stats?stats.total_songs:null;
  const covered=stats?stats.covered_songs:(d.covered_songs??null);
  /* 「已有评论 / 曲库」：子集在前、总数在后 —— 数字读起来就是「已覆盖多少 / 一共多少」 */
  const songRatio=(totalSongs==null&&covered==null)?'—':`${covered==null?'—':Number(covered).toLocaleString()} / ${totalSongs==null?'—':Number(totalSongs).toLocaleString()}`;
  const sizeTitle=size?`评论库文件占用：${Number(storage.bytes).toLocaleString()} 字节（commenthub.db 及其 -wal/-shm；不含备份与其它数据）`:'评论库磁盘占用暂不可用';
  $('#comment-kpis').innerHTML=[
    {label:'已有评论 / 曲库',value:songRatio},
    {label:'评论总量',value:stats?stats.comments_total:(d.comments_total??null)},
    {label:'歌曲覆盖率',value:ratio==null?'—':(ratio*100).toFixed(1)+'%'},
    {label:'评论数据量',value:size||'—',title:sizeTitle},
  ].map((k,i)=>`<div class="card dash-kpi kpi-${i}"${k.title?` title="${esc(k.title)}"`:''}><div class="dash-kpi-label">${k.label}</div><strong>${k.value==null||k.value===''?'—':(typeof k.value==='number'?Number(k.value).toLocaleString():k.value)}</strong>${k.sub?`<div class="dash-kpi-sub">${esc(k.sub)}</div>`:''}</div>`).join('');
}

/** 单独算去重统计：全量库上这一步可能几十秒（缺覆盖索引），所以给足超时并明说。 */
async function chDedup(){
  const btn = $('#ch-dedup');
  if (btn){ btn.disabled = true; btn.textContent = '计算中…'; }
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await chApi('/api/v2/stats?dedup=1', { signal: ctl.signal });
    const d = (r && r.data) || {};
    CH_STATS = d;
    await renderComments();          // 重画状态卡片（这次带 dedup_computed=true）
  } catch (e) {
    if (btn){ btn.disabled = false; btn.textContent = '算一下'; }
    const hint = (String(e.message).indexOf('timed') >= 0 || String(e.name) === 'AbortError')
      ? '等太久了，先不看了（给库加一个覆盖索引之后就秒出，见方案 §47）'
      : ('失败：' + e.message);
    if (btn && btn.parentNode) btn.parentNode.innerHTML = '去重统计：' + chEsc(hint);
  } finally {
    clearTimeout(timer);
  }
}

function dashDonut(el,items,total,centerLabel,centerValue){

    const portion=Number(x.value)/sum*100,start=cursor;cursor+=portion;
    const gap=clean.length>1?Math.min(4,portion*.45):0;
    return `<circle class="ring-segment" cx="64" cy="64" r="53" pathLength="100" stroke="${esc(x.color||dashColor(x.key))}" stroke-dasharray="${portion-gap} ${100-portion+gap}" stroke-dashoffset="${-start-gap/2}" transform="rotate(-90 64 64)"/>`;
  }).join('');

let KUGOU_MODAL_OPEN = false;

      <button type="button" onclick="changeKugouLoginMethod('sms')"><i aria-hidden="true">▣</i>短信登录</button></div></div>`;
  modal.onclick = e => { if (e.target === modal) closeKugouLogin(); };
  modal.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); closeKugouLogin(); }
    if (e.key !== 'Tab') return;
    const nodes = [...modal.querySelectorAll('button,input')].filter(x => !x.disabled && !x.hidden && x.getClientRects().length);
    const first = nodes[0], last = nodes[nodes.length - 1];

}
async function requireKugouAdmin(){

}
function showKugouAdminLogin(){

    : '请先登录 Bridge 管理账户，再点击酷狗登录；短信只会在点击发送验证码后发送。';

async function kugouLoginError(e, status){

  if (e.status === 401 || /未登录|会话已过期|CSRF/.test(reason)) {
    await loadSession(); showKugouAdminLogin();
  } else $(status).textContent = reason;
}
async function openKugouLogin(){

let KUGOU_QR_FLOW = null;
let KUGOU_QR_TIMER = null;
let KUGOU_QR_BUSY = false;
let KUGOU_LOGIN_GENERATION = 0;
let KUGOU_QR_METHOD = 'kugou';
function stopKugouQr(){
  if (KUGOU_QR_TIMER) clearTimeout(KUGOU_QR_TIMER);
  KUGOU_QR_TIMER = null;
  KUGOU_QR_FLOW = null;
  KUGOU_QR_BUSY = false;
}
async function startKugouQr(){
  if (PLAT !== 'kugou' || !KUGOU_MODAL_OPEN || KUGOU_QR_BUSY) return;
  const generation = ++KUGOU_LOGIN_GENERATION;
  const modalGeneration = KUGOU_MODAL_GENERATION;
  const method = KUGOU_LOGIN_METHOD;
  if (!['kugou','qq'].includes(method)) return;
  if (!await requireKugouAdmin() || generation !== KUGOU_LOGIN_GENERATION || modalGeneration !== KUGOU_MODAL_GENERATION) return;
  KUGOU_QR_METHOD = method;
  stopKugouQr(); KUGOU_QR_BUSY = true;
  $('#kugou-qr-start').disabled = true;
  $('#kugou-qr-status').textContent = '正在向酷狗申请二维码…';
  $('#kugou-qr-panel').hidden = false;
  $('#kugou-qr-image').hidden = true;
  $('#kugou-qr-image').removeAttribute('src');
  try {
    const d = await api('/api/platform-login/kugou/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({method})});
    if (PLAT !== 'kugou' || generation !== KUGOU_LOGIN_GENERATION) {
      await api('/api/platform-login/kugou/cancel', {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({flow_id:d.flow_id})}).catch(()=>{});
      return;
    }
    KUGOU_QR_FLOW = d.flow_id;
    $('#kugou-qr-image').src = d.qr;
    $('#kugou-qr-image').hidden = false;
    $('#kugou-qr-status').textContent = `请使用${method === 'qq' ? 'QQ' : '酷狗音乐 App'}扫码并确认登录。二维码约 3 分钟有效。`;
    pollKugouQr();
  } catch(e) {
    if (generation !== KUGOU_LOGIN_GENERATION) return;
    await kugouLoginError(e, '#kugou-qr-status');
    if (generation !== KUGOU_LOGIN_GENERATION) return;
    KUGOU_QR_BUSY = false;
    $('#kugou-qr-start').disabled = false;
  }
}
async function pollKugouQr(){
  const flow = KUGOU_QR_FLOW;
  if (!flow || PLAT !== 'kugou') return;
  try {
    const d = await api('/api/platform-login/kugou/poll', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({flow_id:flow})});
    if (flow !== KUGOU_QR_FLOW) return;
    if (d.state === 'pending') $('#kugou-qr-status').textContent = `等待使用${KUGOU_QR_METHOD === 'qq' ? 'QQ' : '酷狗 App'}扫码…`;
    else if (d.state === 'scanned') $('#kugou-qr-status').textContent = '已扫码，请在手机上确认登录…';
    else if (d.state === 'complete') {
      const generation = KUGOU_MODAL_GENERATION;
      $('#kugou-qr-status').textContent = '正在获取歌单…';
      stopKugouQr(); $('#kugou-qr-start').disabled = false;
      await finishKugouLogin(d.userid, generation);
      return;
    } else {
      $('#kugou-qr-status').textContent = d.state === 'expired' ? '二维码已过期，请重新生成。' : (d.message || '登录失败，请重新扫码。');
      stopKugouQr(); $('#kugou-qr-start').disabled = false;
      return;
    }
  } catch(e) {
    if (flow !== KUGOU_QR_FLOW) return;
    await kugouLoginError(e, '#kugou-qr-status');
    if (flow !== KUGOU_QR_FLOW) return;
    stopKugouQr(); $('#kugou-qr-start').disabled = false;
    return;
  }
  if (KUGOU_QR_FLOW === flow) KUGOU_QR_TIMER = setTimeout(pollKugouQr, 1800);
}
async function cancelKugouQr(){
  ++KUGOU_LOGIN_GENERATION;
  const flow = KUGOU_QR_FLOW;
  stopKugouQr();
  const panel = $('#kugou-qr-panel');
  if (panel) panel.hidden = true;
  const start = $('#kugou-qr-start');
  if (start) start.disabled = false;
  if (flow) {
    try { await api('/api/platform-login/kugou/cancel', {method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({flow_id:flow})}); }
    catch(e) {}
  }
}

let KUGOU_SMS_FLOW = null;
let KUGOU_SMS_BUSY = false;
let KUGOU_SMS_NEXT_SEND = 0;
let KUGOU_SMS_TIMER = null;
let KUGOU_SMS_GENERATION = 0;
function changeKugouLoginMethod(method){
  if (!KUGOU_MODAL_OPEN || !['kugou','qq','sms'].includes(method)) return;

  $('#kugou-qr-hint').textContent = method === 'qq' ? '打开 QQ，扫一扫授权登录酷狗' : '打开酷狗音乐 App，扫一扫登录';
  if (method === 'sms') { updateKugouSmsCountdown(); $('#kugou-mobile').focus(); }
  else startKugouQr();

function updateKugouSmsCountdown(){
  if (KUGOU_SMS_TIMER) clearTimeout(KUGOU_SMS_TIMER);
  KUGOU_SMS_TIMER = null;
  if (!KUGOU_MODAL_OPEN || KUGOU_LOGIN_METHOD !== 'sms') return;
  const seconds = Math.max(0, Math.ceil((KUGOU_SMS_NEXT_SEND - Date.now())/1000));
  $('#kugou-sms-send').disabled = KUGOU_SMS_BUSY || seconds > 0;
  $('#kugou-sms-send').textContent = seconds ? `${seconds} 秒后可重发` : '发送验证码';
  if (seconds) KUGOU_SMS_TIMER = setTimeout(updateKugouSmsCountdown, 1000);
  else KUGOU_SMS_TIMER = null;

async function sendKugouSms(){
  if (PLAT !== 'kugou' || !KUGOU_MODAL_OPEN || KUGOU_LOGIN_METHOD !== 'sms' || KUGOU_SMS_BUSY || Date.now() < KUGOU_SMS_NEXT_SEND) return;
  const modalGeneration = KUGOU_MODAL_GENERATION;
  const authGeneration = KUGOU_SMS_GENERATION;
  if (!await requireKugouAdmin() || modalGeneration !== KUGOU_MODAL_GENERATION || authGeneration !== KUGOU_SMS_GENERATION || KUGOU_SMS_BUSY) return;
  const mobile = $('#kugou-mobile').value.trim();
  if (!/^1[3-9][0-9]{9}$/.test(mobile)) { $('#kugou-sms-status').textContent = '请输入中国大陆 11 位手机号'; return; }
  if (KUGOU_SMS_FLOW) await cancelKugouSms();
  if (!KUGOU_MODAL_OPEN || modalGeneration !== KUGOU_MODAL_GENERATION || KUGOU_LOGIN_METHOD !== 'sms' || KUGOU_SMS_BUSY) return;
  const generation = ++KUGOU_SMS_GENERATION;
  KUGOU_SMS_BUSY = true;
  $('#kugou-sms-verify').disabled = true;
  $('#kugou-mobile').disabled = true;
  // No automatic retries: a timeout may still have sent the SMS.
  KUGOU_SMS_NEXT_SEND = Date.now() + 60000;
  updateKugouSmsCountdown();
  $('#kugou-sms-status').textContent = '正在请求短信验证码…';
  try {
    const d = await api('/api/platform-login/kugou/sms/send', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile})});
    if (generation !== KUGOU_SMS_GENERATION || PLAT !== 'kugou' || KUGOU_LOGIN_METHOD !== 'sms') {
      await api('/api/platform-login/kugou/cancel', {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({flow_id:d.flow_id})}).catch(()=>{}); return;
    }
    KUGOU_SMS_FLOW = d.flow_id;
    $('#kugou-sms-status').textContent = `验证码已发送至 ${d.mobile_masked}，请在 5 分钟内填写并验证。`;
    $('#kugou-sms-verify').disabled = false;
    $('#kugou-sms-code').focus();
  } catch(e) {
    if (generation === KUGOU_SMS_GENERATION) await kugouLoginError(e, '#kugou-sms-status');
  } finally {
    if (generation === KUGOU_SMS_GENERATION) {KUGOU_SMS_BUSY = false; $('#kugou-mobile').disabled = !!KUGOU_SMS_FLOW; updateKugouSmsCountdown();}
  }
}
async function verifyKugouSms(){
  if (!KUGOU_MODAL_OPEN || !KUGOU_SMS_FLOW || KUGOU_SMS_BUSY) return;

    if (d.state !== 'complete') {$('#kugou-sms-status').textContent = d.state === 'expired' ? '验证码登录流程已过期，请重新获取' : (d.message || '登录已取消，请重新获取验证码'); KUGOU_SMS_FLOW = null; return;}

  }
}
async function cancelKugouSms(){
  ++KUGOU_SMS_GENERATION;

function pickPlat(k){

  saveSourceDraft();

async function fetchPlaylists(isCurrent){
  // Inline click handlers may pass no guard; login supplies a generation guard.
  const current = typeof isCurrent === 'function' ? isCurrent : () => true;
  const platform = PLAT;
  const user = FUSER, ref = $('#wr').value.trim();
  if (!user) return aAlert('还没选账户', '请先选择要同步到哪个飞牛音乐账户。');
  if (!ref) return aAlert('还没填链接', '请粘贴该平台的歌单或主页链接。');
  $('#resolve-box').innerHTML = '<div class="empty">正在获取歌单…</div>';
  try {
    const resolved = await api('/api/resolve', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({platform, ref})});
    if (!current() || platform !== PLAT || user !== FUSER) return false;
    R = resolved; R.user = user; R.ref = R.ref || ref;
    renderResolved(); return true;
  } catch(e) {
    if (current() && platform === PLAT) {
      $('#resolve-box').innerHTML = `<div class="notice err">获取失败：${esc(e.message)}</div>`;
      if (typeof isCurrent === 'function' && KUGOU_MODAL_OPEN) {
        await kugouLoginError(e, KUGOU_LOGIN_METHOD === 'sms' ? '#kugou-sms-status' : '#kugou-qr-status');
      }
    }
    return false;
  }
}

function grpBlock(title, list, key){
  if (!list || !list.length) return '';
  return `<div class="grp">
    <div class="grp-hd">${title}　<span class="pill">${list.length} 个</span></div>
    ${list.map((x,i) => `<div class="grp-row">
        <input type="checkbox" data-g="${key}" data-i="${i}" checked>
        <span class="nm"><b>${esc(x.name)}</b></span>
        <span class="hint">${x.count} 首</span>
        <input data-n="${key}:${i}" value="${esc(x.name)}" title="飞牛目标歌单名">
      </div>`).join('')}
  </div>`;
}

function renderResolved(){
  const kugouAccount = R.platform === 'kugou' && /^user:\d+$/.test(R.ref);
  const note = !kugouAccount && R.note ? `<div class="notice" style="margin-top:12px">${esc(R.note)}</div>` : '';
  $('#resolve-box').innerHTML = `
    ${kugouAccount ? '' : `<div class="notice">已识别：<b>${esc(R.owner || '')}</b>。
      勾选要同步的歌单，右侧可直接改成飞牛里的目标名称。</div>`}
    ${note}
    ${grpBlock('创建的歌单', R.created, 'c')}
    ${grpBlock('收藏的歌单', R.favorited, 'f')}
    <div style="margin-top:16px">
      <button class="btn primary" onclick="saveAndSync()">保存映射并同步</button>
    </div>`;
}

async function saveAndSync(){
  const cfg = S.accounts_cfg || [];
  const syncUser = R.user;
  let a = cfg.find(x => x.fn_user === R.user);
  if (!a) { a = {fn_user: R.user}; cfg.push(a); }
  a[R.platform] = R.ref;
  a.playlist_ids = Object.assign({}, a.playlist_ids || {});
  a.playlist_names = Object.assign({}, a.playlist_names || {});
  const ids = [], names = {};
  let allSelected = true;
  [['c', R.created || []], ['f', R.favorited || []]].forEach(([key, list]) => {
    list.forEach((x, i) => {
      const cb = document.querySelector(`[data-g="${key}"][data-i="${i}"]`);
      if (cb && cb.checked) {
        ids.push(String(x.id));
        names[`${R.platform}:${x.id}`] =
          document.querySelector(`[data-n="${key}:${i}"]`).value.trim() || x.name;
      } else {
        allSelected = false;
      }
    });
  });
  a.playlist_ids[R.platform] = R.platform === 'kugou' && /^user:\d+$/.test(R.ref) && allSelected
    ? null : ids;
  Object.assign(a.playlist_names, names);
  try {
    await api('/api/save-accounts', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({accounts: cfg})});
  } catch(e) { return aAlert('保存失败', esc(e.message)); }
  $('#resolve-box').innerHTML = '';
  R = null;
  await load();
  show('sync');
  loadList(true);                    // 刚加的平台，歌单列表立即补上
  run('sync', syncUser);}

/* ================= 歌单同步 · ② 歌单列表 ================= */
let LIST = null;        // /api/account-playlists 的结果
let LUSER = null;       // 当前选中的账户（标签按钮）
let LBUSY = false;      // 正在等网络 —— 要挡住操作
let LBG = false;        // 后台补抓中 —— 只让刷新图标转圈，不挡操作
let LQUIET = false;     // 后台补抓正在进行
let LTRY = false;       // 本次打开页面只自动补抓一次，别拿平台当缓存刷
const LOPEN = {};       // 平台分组的展开状态（默认全折叠）

function listBusy(on, title){
  // 页面上不再有提示文字，只把「刷新歌单」按钮转一圈表示在忙
  LBUSY = !!on;
  const b = $('#list-refresh');
  if (b) {
    b.classList.toggle('spin', LBUSY || LBG);
    b.title = title || (LBG ? '正在后台更新…' : '重新去平台抓一次歌单');
  }
  const s = $('#list-sync');
  if (s) {
    // 后台补抓不挡手动同步
    s.disabled = !LUSER || LBUSY;
    s.title = LUSER ? `手动同步账户「${LUSER}」的歌单（不受平台开关影响）` : '先选一个账户';
  }
}

/* 手动同步不受平台开关影响：那个开关只管每天定时的自动同步 */
function syncCurrent(){
  if (!LUSER) return aAlert('还没选账户', '先在上面的账户标签里选一个。');
  run('sync', LUSER, $('#list-sync'));      // 把按钮传进去，它自己也会变成进度条
}

/* ---------------- 「歌单列表」顶上的同步进度条 ---------------- */
function paintListProg(){
  const el = $('#list-prog');
  if (!el) return;
  const j = GR.job || {};
  const act = j.action || j.scope;      // run() 给 action，@@P 行给 scope，两个都认
  const mine = act === 'sync' || act === 'refresh';   // 只有这个页面发起的任务才画
  const fin = GR.progDone;
  if (!mine || (!j.running && !fin)) {
    el.hidden = true; el.className = 'prog';
    paintListRows(null);
    return;
  }
  const cn = ACTION_CN[act] || act;
  const n = j.n || 0, i = j.i || 0;
  let cls = 'prog', lbl, meta = '', pct = '', indet = false, fill = 100;
  if (fin) {                                   // 收尾：绿一下 / 红一下，然后自己收回去
    const bad = fin.code != null && fin.code !== 0;
    cls += bad ? ' fail' : ' done';
    lbl = bad ? `${cn}出错` : `${cn}完成`;
    meta = n ? `${n} 个歌单` : '';
    pct = bad ? `退出码 ${fin.code}` : '100%';
  } else {
    lbl = `正在${cn}${j.user ? '「' + j.user + '」' : ''}`;
    meta = [n ? `${i}/${n}` : '', j.name || ''].filter(Boolean).join(' · ');
    // 整轮进度 = 前面跑完的 + 当前这张写进去的百分比，单调不回头
    const cur = (j.pct == null ? 0 : Math.max(0, Math.min(100, j.pct)) / 100);
    if (n) {
      fill = Math.max(0, Math.min(100, ((i - 1) + cur) / n * 100));
      pct = Math.round(fill) + '%';
    } else { indet = true; }
  }
  el.className = cls;
  el.hidden = false;
  $('#pg-lbl').textContent = lbl;
  $('#pg-meta').textContent = meta;
  $('#pg-pct').textContent = pct;
  const track = el.querySelector('.track');
  track.classList.toggle('indet', indet);
  $('#pg-fill').style.width = indet ? '' : fill + '%';
  paintListRows(fin ? null : j);
}

/* 正在处理的那一行淡淡的亮起来，状态位临时改成「写入 62%」 */
function paintListRows(j){
  const key = (j && j.platform && j.pid) ? j.platform + ':' + String(j.pid) : null;
  document.querySelectorAll('#list-body .prow').forEach(r => {
    const hit = !!key && r.dataset.k === key;
    r.classList.toggle('live', hit);
    const mk = r.querySelector('.mk');
    if (!mk) return;
    if (!r.dataset.mk) r.dataset.mk = mk.textContent;
    if (hit && j.step) {
      mk.textContent = j.step + (j.pct == null ? '…' : ' ' + Math.round(j.pct) + '%');
    } else {
      mk.textContent = r.dataset.mk;
    }
  });
}

function renderSync(){
  if (!WIZ_READY) buildWizard();
  if (!LIST) loadList(false);
}

/* 后端只负责把缓存丢回来（可能已经过期），这里统一上屏 */
function applyList(d){
  LIST = d;
  if (!(LIST.accounts || []).some(a => a.user === LUSER)) {
    LUSER = (LIST.accounts[0] || {}).user || null;
  }
  renderAcctTabs();
  renderListBody();
}

function anyStale(d){
  const src = d || LIST;
  return ((src && src.accounts) || [])
    .some(a => (a.platforms || []).some(p => p.stale));
}

/* 拿到的是老数据：先让用户看着，网络请求丢到后台，回来了再悄悄换上。
   一次页面生命周期只自动补一次，别把平台当缓存刷。 */
async function revalidateList(){
  if (LTRY || LQUIET || LBUSY) return;
  LTRY = true; LQUIET = true; LBG = true;
  const b = $('#list-refresh');
  if (b) { b.classList.add('spin'); b.title = '正在后台更新…'; }
  try {
    applyList(await api('/api/account-playlists?refresh=1'));
  } catch(e) {
    // 后台更新失败就继续用老数据，页面上不弹错（「刷新」按钮随时可以手动重试）
  } finally {
    LQUIET = false; LBG = false;
    listBusy(LBUSY);
  }
}

async function loadList(refresh){
  const body = $('#list-body');
  if (!refresh && LIST) { renderListBody(); return; }   // 内存里有，直接画，不打扰后端
  if (body) body.innerHTML = '<div class="empty">正在读取各平台歌单…</div>';
  listBusy(true, refresh ? '正在重新抓取…' : '正在读取…');
  let d;
  try {
    d = await api('/api/account-playlists' + (refresh ? '?refresh=1' : ''));
  } catch(e) {
    if (body) body.innerHTML = `<div class="notice err">读取失败：${esc(e.message)}</div>`;
    listBusy(false, '读取失败，点这里重试');
    return;
  }
  applyList(d);
  listBusy(false);
  if (!refresh && anyStale(d)) revalidateList();       // 缓存过期：后台补抓
}

function renderAcctTabs(){
  const accs = (LIST && LIST.accounts) || [];
  const status = S.accounts || {};
  renderHeaderAccount('list', accs.map(a => ({user:a.user, valid:!!(status[a.user] || {}).valid})), LUSER || '');
}

function pickListUser(u){
  LUSER = u;
  renderAcctTabs();
  renderListBody();
}

function togglePlat(el){
  const g = el.closest('.pgrp');
  if (!g) return;
  g.classList.toggle('open');
  LOPEN[g.dataset.k] = g.classList.contains('open');
}

async function togglePlatAuto(user, plat, el, ev){
  if (ev) ev.stopPropagation();
  const on = !el.classList.contains('on');
  el.classList.toggle('on', on);
  try {
    await api('/api/account-autosync', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user, platform: plat, enabled: on})});
  } catch(e) {
    el.classList.toggle('on', !on);
    return aAlert('保存失败', esc(e.message));
  }
  const a = (S.accounts_cfg || []).find(x => x.fn_user === user);
  if (a) { a.autosync = Object.assign({}, a.autosync || {}); a.autosync[plat] = on; }
  const row = ((LIST.accounts || []).find(x => x.user === user) || {}).platforms || [];
  const mine = row.find(x => x.platform === plat);
  if (mine) mine.autosync = on;
}

/* 这个平台现在勾了哪些（selected_all 时返回 null = 全都算勾上） */
function selSetOf(p){
  return p.selected_all ? null : new Set((p.selected || []).map(String));
}
function isPicked(p, id){
  // 「全部」模式下被单独摘掉的（在融合页断开连线时记的排除表），仍然算没勾
  if ((p.excluded || []).some(x => String(x) === String(id))) return false;
  const s = selSetOf(p);
  return !s || s.has(String(id));
}
function pickedIds(p){
  return (p.all || []).map(x => String(x.id)).filter(id => isPicked(p, id));
}
/* 平台标题右边那几个小动作：缺多少张、要不要改成「全部」 */
/* 平台标题右边只有一个图标按钮：勾亮着 = 该平台「全部同步，含以后新增」，
   灭着 = 只同步手动勾上的那些。点一下在两种模式间切换。
   这样既不占版面，也不需要多一个「加入新增」按钮 —— 点它变「全部」就全包了。 */
function platActs(user, p){
  const on = !!p.selected_all;
  // 提示就一句话，别写小作文
  const t = on ? '仅同步勾选的' : '全部选择';
  return `<button class="pmod${on ? ' on' : ''}" title="${t}"
    onclick="event.stopPropagation();togglePlatMode('${esc(user)}','${p.platform}')">
    <svg viewBox="0 0 24 24"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.4"/>
      <path class="tick" d="M8.1 12.2l2.8 2.8 5-5.4"/></svg></button>`;
}

/* 只重画这一组（标题上的数字/按钮 + 每行的勾和状态），不整块重刷，免得太跳 */
function repaintGroup(user, plat){
  const p = platState(user, plat);
  const g = document.querySelector(`#list-body .pgrp[data-k="${user}|${plat}"]`);
  if (!p || !g) return;
  const all = p.all || [];
  const selN = pickedIds(p).length;
  const builtN = all.filter(x => x.built).length;
  const cnt = g.querySelector('.ps-count');
  if (cnt) cnt.textContent = `${all.length} 个歌单`;
  const mode = g.querySelector('.pmod');
  if (mode) { mode.classList.toggle('on', !!p.selected_all); mode.title = p.selected_all ? '仅同步勾选的' : '全部选择'; }
  g.querySelectorAll('.prow').forEach(r => {
    const id = (r.dataset.k || '').split(':').slice(1).join(':');
    const x = all.find(y => String(y.id) === id);
    if (!x) return;
    const st = rowState(p, x);
    r.classList.toggle('off', !st.on);
    const cb = r.querySelector('.pcell input');
    if (cb) cb.checked = st.on;
    const mk = r.querySelector('.mk');
    if (mk && !r.classList.contains('live')) {
      mk.textContent = st.txt;
      mk.className = 'mk ' + st.cls;
      mk.title = st.tip || '';
      r.dataset.mk = st.txt;
    }
  });
  paintListRows(GR.job && GR.job.running ? GR.job : null);
}

function platState(user, plat){
  const acc = ((LIST && LIST.accounts) || []).find(a => a.user === user);
  return acc ? (acc.platforms || []).find(x => x.platform === plat) : null;
}

async function savePick(user, plat, ids){
  const p = platState(user, plat);
  if (!p) return;
  try {
    await api('/api/account-selection', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user, platform: plat, ids})});
  } catch(e) {
    aAlert('保存失败', esc(e.message));
    repaintGroup(user, plat);           // 回滚界面
    return;
  }
  p.selected_all = ids === null;
  p.selected = ids === null ? null : ids.slice();
  if (ids === null) p.excluded = [];    // 「全部」就是真的全部，排除表一起清掉
  repaintGroup(user, plat);
}

/* 「全部」模式下单独摘掉几张：只写排除表，**不改模式**，
   所以平台以后新增的歌单照样自动跟上。 */
async function saveExclude(user, plat, ids){
  const p = platState(user, plat);
  if (!p) return;
  try {
    await api('/api/account-exclude', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user, platform: plat, ids})});
  } catch(e) {
    aAlert('保存失败', esc(e.message));
    repaintGroup(user, plat);
    return;
  }
  p.excluded = (ids || []).map(String);
  repaintGroup(user, plat);
}

/* 勾选框：勾上/取消。
   「只勾这些」模式下重算白名单；
   「全部」模式下只记一条排除 —— 以前这里会把平台当时的歌单冻成一份白名单，
   于是「全部同步（含以后新增）」就没了，正是「点了全选却变成只勾这些」的来源。 */
function togglePick(cb, user, plat, id){
  const p = platState(user, plat);
  if (!p) return;
  const sid = String(id);
  const cur = new Set(pickedIds(p));
  if (cb.checked) cur.add(sid); else cur.delete(sid);
  if (p.selected_all) {
    const ex = (p.excluded || []).map(String);
    saveExclude(user, plat, cb.checked ? ex.filter(x => x !== sid)
                                       : Array.from(new Set(ex.concat([sid]))));
  } else {
    savePick(user, plat, (p.all || []).map(x => String(x.id)).filter(x => cur.has(x)));
  }
}
function pickAllMode(user, plat){        // 设为「全部」：以后新增的自动跟上
  savePick(user, plat, null);
}
/* 图标按钮：两种模式来回切。
   灭（只勾这些）→ 亮（全部）：白名单删掉，以后平台新增的自动跟上；
   亮（全部）→ 灭（只勾这些）：把「现在勾着的这些」落成白名单。 */
function togglePlatMode(user, plat){
  const p = platState(user, plat);
  if (!p) return;
  if (p.selected_all) savePick(user, plat, pickedIds(p));
  else pickAllMode(user, plat);
}

/* 每行状态说的是**实际状态**，不是「勾没勾」：
   已同步 = 飞牛音乐里已经有这张；待同步 = 勾了还没建出来；未选择 = 没勾、也没建。
   以前这里直接拿「勾没勾」当「同步没同步」，于是已经建好的歌单会显示成「未选择」，
   而勾了还没建的反而显示成「已同步」—— 两头都在骗人。 */
function rowState(p, x){
  const on = isPicked(p, x.id);
  if (x.built) {
    return {on, txt: '已同步', cls: 'ok',
            tip: on ? '' : '飞牛音乐里已经有这张了，但当前不在同步清单里 —— 勾上就重新纳入'};
  }
  if (on) return {on, txt: '待同步', cls: 'wait', tip: '已经勾上，还没同步到飞牛音乐'};
  return {on, txt: '未选择', cls: 'no', tip: ''};
}

function playlistIdDisplay(platform, id, rows){
  const full = String(id ?? '');
  if (platform !== 'kugou') return full;
  const match = /^(collection_\d+_\d+_)(\d+_\d+)$/.exec(full);
  if (!match || !rows.length) return full;
  const common = rows.every(row => {
    const other = /^(collection_\d+_\d+_)(\d+_\d+)$/.exec(String(row.id ?? ''));
    return other && other[1] === match[1];
  });
  return common ? match[2] : full;
}

function renderListBody(){
  const body = $('#list-body');
  if (!body) return;
  const accs = (LIST && LIST.accounts) || [];
  if (!accs.length) {
    body.innerHTML = '<div class="empty">还没有配置任何来源，先在上面「添加来源」里绑一个。</div>';
    listBusy(false);
    return;
  }
  const me = accs.find(a => a.user === LUSER) || accs[0];
  const plats = me.platforms || [];
  if (!plats.length) {
    body.innerHTML = `<div class="empty">账户「${esc(me.user)}」还没有配置音乐平台。</div>`;
    listBusy(false);
    return;
  }
  const cached = plats.some(p => p.stale);
  listBusy(false, cached ? '显示的是缓存，点这里重新抓一次' : '重新去平台抓一次歌单');

  body.innerHTML = plats.map(p => {
    const k = me.user + '|' + p.platform;
    const all = p.all || [];
    const open = !!LOPEN[k];
    const selN = pickedIds(p).length;
    const builtN = all.filter(x => x.built).length;
    const rows = all.map(x => {
      const st = rowState(p, x);
      return `<div class="prow${st.on ? '' : ' off'}" data-k="${esc(p.platform + ':' + String(x.id))}"
        data-mk="${st.txt}">
        <span class="pcell"><input type="checkbox"${st.on ? ' checked' : ''}
          title="${st.on ? '取消选择' : '选择这张'}"
          onclick="event.stopPropagation()"
          onchange="togglePick(this,'${esc(me.user)}','${p.platform}','${esc(String(x.id))}')"></span>
        <span class="nm">${esc(x.name || '（未命名）')}</span><span class="pid" title="${esc(String(x.id))}">${esc(playlistIdDisplay(p.platform, x.id, all))}</span>
        <span class="ct">${x.count || 0} 首</span>
        <span class="mk ${st.cls}"${st.tip ? ` title="${esc(st.tip)}"` : ''}>${st.txt}</span></div>`;
    }).join('') || '<div class="empty">这个平台下没读到歌单。</div>';
    const err = p.error
      ? `<span class="pill warn" title="${esc(p.error)}">上次抓取失败</span>` : '';
    const cnt = `${all.length} 个歌单`;
    return `<div class="pgrp${open ? ' open' : ''}" data-k="${esc(k)}">
      <div class="pgrp-hd" onclick="togglePlat(this)">
        <button class="pmod${p.selected_all ? ' on' : ''}" title="${p.selected_all ? '仅同步勾选的' : '全部选择'}"
          onclick="event.stopPropagation();togglePlatMode('${esc(me.user)}','${p.platform}')">
          <svg viewBox="0 0 24 24"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.4"/><path class="tick" d="M8.1 12.2l2.8 2.8 5-5.4"/></svg>
        </button>
        <span class="plat-info">${pic(p.platform, 'pic')}<span class="pn">${esc(p.name)}</span>${p.owner ? `<span class="ps">${esc(p.owner)}</span>` : ''}</span>
        <span class="plat-count ps-count">${cnt}</span>
        ${err ? `<span class="err-pill">${err}</span>` : ''}
        <span class="asw" onclick="event.stopPropagation()" title="关掉后，每天定时的自动同步不再跑这个平台">
          <button class="sw sm${p.autosync ? ' on' : ''}"
            aria-label="${esc(p.name)}自动同步开关"
            onclick="togglePlatAuto('${esc(me.user)}','${p.platform}',this,event)"></button>
        </span>
        <svg class="chev-ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="pgrp-bd">${rows}</div>
    </div>`;
  }).join('');
}

/* ================================================================
   歌单融合：映射图谱（三列）
