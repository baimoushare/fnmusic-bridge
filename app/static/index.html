let toastTimer = null;
function toast(msg){
  const el = $('#g-toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function syncCustomSelect(sel){
  if(!sel || !sel._customSelectWrap)return;
  const wrap=sel._customSelectWrap, btn=wrap.querySelector('.dd-btn'), label=wrap.querySelector('.dd-nm'), menu=wrap.querySelector('.dd-menu');
  const opt=sel.options[sel.selectedIndex];
  if(label)label.textContent=opt?opt.textContent:'选择…';
  if(btn){btn.disabled=!!sel.disabled;btn.setAttribute('aria-expanded',wrap.classList.contains('open')?'true':'false');}
  if(menu)menu.querySelectorAll('.dd-item').forEach((row,i)=>row.classList.toggle('on',!!sel.options[i]&&sel.options[i].value===sel.value));
}
function enhanceSelect(sel){
  if(!sel || sel.dataset.customDd==='1' || sel.id==='g-accts' || sel.multiple)return;
  if(sel.style.display==='none')return;
  sel.dataset.customDd='1';
  const wrap=document.createElement('div');wrap.className='dd select-dd';
  if(sel.classList.contains('cadence-extra')){wrap.classList.add('cadence-extra');if(sel.classList.contains('on'))wrap.classList.add('on');}
  const btn=document.createElement('button');btn.type='button';btn.className='dd-btn';btn.setAttribute('role','combobox');btn.setAttribute('aria-haspopup','listbox');
  btn.innerHTML='<span class="dd-nm"></span><span class="dd-arw"></span>';
  const menu=document.createElement('div');menu.className='dd-menu';menu.setAttribute('role','listbox');
  const parent=sel.parentNode;parent.insertBefore(wrap,sel);wrap.appendChild(btn);wrap.appendChild(menu);wrap.appendChild(sel);sel.classList.add('native-select');sel.tabIndex=-1;sel.setAttribute('aria-hidden','true');sel._customSelectWrap=wrap;
  const render=()=>{menu.innerHTML=Array.from(sel.options).map((o,i)=>`<div class="dd-item${o.disabled?' disabled':''}${o.value===sel.value?' on':''}" role="option" aria-selected="${o.value===sel.value}" data-index="${i}"><span class="dd-nm">${esc(o.textContent)}</span><span class="dd-st"></span></div>`).join('');syncCustomSelect(sel);};
  render();
  btn.onclick=ev=>{ev.stopPropagation();document.querySelectorAll('.select-dd.open').forEach(x=>{if(x!==wrap)x.classList.remove('open')});wrap.classList.toggle('open');syncCustomSelect(sel);};
  menu.onclick=ev=>{ev.stopPropagation();const row=ev.target.closest('[data-index]');if(!row||row.classList.contains('disabled'))return;const opt=sel.options[Number(row.dataset.index)];if(!opt)return;sel.value=opt.value;sel.dispatchEvent(new Event('change',{bubbles:true}));wrap.classList.remove('open');syncCustomSelect(sel);};
  sel.addEventListener('change',()=>{render();});
  sel.addEventListener('input',()=>{render();});
  sel._renderCustomSelect=render;
}
function enhanceAllSelects(root=document){root.querySelectorAll('select').forEach(enhanceSelect);}
document.addEventListener('click',ev=>{if(ev.target.closest('.select-dd'))return;document.querySelectorAll('.select-dd.open').forEach(x=>x.classList.remove('open'));});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')document.querySelectorAll('.select-dd.open').forEach(x=>x.classList.remove('open'));});
const selectObserver=new MutationObserver(records=>{for(const r of records){if(r.target instanceof HTMLSelectElement&&r.target._renderCustomSelect)r.target._renderCustomSelect();if(r.type==='childList'){r.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches&&n.matches('select'))enhanceSelect(n);if(n.querySelectorAll)enhanceAllSelects(n);});}}});
selectObserver.observe(document.body,{childList:true,subtree:true});
enhanceAllSelects();

/* ==================================================================
   管理鉴权（P3）：未登录不能执行任何管理写操作。
   写请求都要带 X-Bridge-CSRF —— 令牌来自登录响应或 /api/session。
================================================================== */
let SESSION = {authenticated:false, configured:false, csrf:null, auth_disabled:false};


async function loadSession(){
  try{ SESSION = await api('/api/session'); }
  catch(e){ SESSION = {authenticated:false, configured:false}; }
  renderAuthBar();
}
function renderAuthBar(){
  const bar = $('#authbar');
  if (!bar) return;
  const account=$('#side-account'),accountLabel=$('#side-account-label'),avatar=$('#side-account-avatar');
  const isAuthenticated=!!SESSION.authenticated;
  if(accountLabel)accountLabel.textContent=isAuthenticated?(SESSION.username||'admin'):(SESSION.configured?'未登录':'未配置');
  if(avatar)avatar.textContent=isAuthenticated?String(SESSION.username||'admin').trim().slice(0,1).toUpperCase():'♙';
  if(account){account.title=isAuthenticated?'已登录：'+(SESSION.username||'admin'):'点击登录管理账户';account.classList.toggle('authenticated',isAuthenticated);}
  if (SESSION.auth_disabled){ bar.style.display = 'none'; if(account){accountLabel.textContent='无需登录';account.disabled=true;} return; }
  bar.style.display = 'flex';
  const msg = $('#authmsg');
  if (msg) msg.classList.remove('bad');
  const pass = $('#auth-pass'), user = $('#auth-user');
  if (SESSION.authenticated){
    $('#authmsg').textContent = '已登录：' + (SESSION.username || 'admin');
    if (pass) pass.value = '';
  } else if (!SESSION.configured){
    $('#authmsg').textContent =
      '尚未设置管理员密码 —— 请在容器上设置 BRIDGE_ADMIN_PASSWORD 后重启（写操作当前已锁定）';
  } else {
    $('#authmsg').textContent = '需要管理员登录才能执行写操作';
  }
  const show = !SESSION.authenticated;
  if (pass) pass.style.display = show ? '' : 'none';
  if (user) user.style.display = show ? '' : 'none';
  const loginBtn=$('#auth-btn'),logoutBtn=$('#auth-logout');
  if(loginBtn)loginBtn.style.display=show?'':'none';
  if(logoutBtn)logoutBtn.style.display=SESSION.authenticated?'':'none';
}
function toggleAccountPopover(event){
  if(event)event.stopPropagation();
  const box=$('#account-popover'),button=$('#side-account');if(!box||!button)return;
  if(box.parentElement!==document.body)document.body.appendChild(box);
  let backdrop=$('#account-backdrop');
  if(!backdrop){backdrop=document.createElement('div');backdrop.id='account-backdrop';document.body.appendChild(backdrop);}
  const open=!box.classList.contains('open');
  if(!open){closeAccountPopover();return;}
  backdrop.classList.add('open');
  backdrop.onclick=closeAccountPopover;
  box.classList.add('open');button.setAttribute('aria-expanded','true');
  if(!SESSION.authenticated)setTimeout(()=>$('#auth-pass')?.focus(),0);
}
function closeAccountPopover(){const box=$('#account-popover'),button=$('#side-account'),backdrop=$('#account-backdrop');if(box)box.classList.remove('open');if(backdrop)backdrop.classList.remove('open');if(button)button.setAttribute('aria-expanded','false');}
document.addEventListener('click',e=>{if(e.target.closest('#side-account,#account-popover'))return;closeAccountPopover();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAccountPopover();});

async function doLogin(){
  /* 反馈一律写在登录条上（#authmsg）：
     早先只写 tkMsg() → #cm-msg，而那个元素只在评论页，
     于是在其它页面点「登录」看起来就像按钮坏了。 */
  const msg = $('#authmsg'), passEl = $('#auth-pass'), btn = $('#auth-btn');
  const body = {username: ((($('#auth-user')||{}).value || 'admin').trim() || 'admin'),
                password: (passEl||{}).value || ''};
  if (!body.password){
    if (msg){ msg.textContent = '请先填写管理员密码'; msg.classList.add('bad'); }
    if (passEl) passEl.focus();
    return;
  }
  const old = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = '登录中…'; }
  if (msg){ msg.textContent = '正在登录…'; msg.classList.remove('bad'); }
  try{
    const r = await fetch('/api/login', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Error(d.error || ('登录失败（HTTP ' + r.status + '）'));
    SESSION.authenticated = true; SESSION.csrf = d.csrf;
    SESSION.username = d.username; SESSION.configured = true;
    if (passEl) passEl.value = '';
    renderAuthBar();
    closeAccountPopover();
    tkMsg('登录成功');
  }catch(e){
    if (msg){ msg.textContent = '登录失败：' + e.message; msg.classList.add('bad'); }
    if (passEl && passEl.select) passEl.select();
    tkMsg('登录失败：' + e.message, true);
  }finally{
    if (btn){ btn.disabled = false; btn.textContent = old || '登录'; }
  }
}
async function doLogout(){
  try{ await fetch('/api/logout', {method:'POST'}); }catch(e){}
  SESSION = {authenticated:false, configured:true, csrf:null};
  renderAuthBar();
  closeAccountPopover();
}
/* 所有写操作都走这里：401 会提示去登录，而不是静默失败 */
async function apiWrite(path, body){
  const r = await fetch(path, {method:'POST',
    headers:{'Content-Type':'application/json','X-Bridge-CSRF': SESSION.csrf || ''},
    body: JSON.stringify(body === undefined ? {} : body)});
  let d = {};
  try{ d = await r.json(); }catch(e){}
  if (r.status === 401){ loadSession(); throw Error(d.error || '未登录或会话已过期'); }
  if (!r.ok) throw Error(d.error || ('请求失败 ' + r.status));
  return d;
}
function tkMsg(text, bad){
  const el = $('#cm-msg');
  if (el){ el.textContent = text; el.style.color = bad ? 'var(--red)' : ''; }
}

/* ==================================================================
   任务中心（P1/P2/P3）：评论刷新 / 备份 / 任务列表 / 日志
================================================================== */
const TK_KIND = {data_backup:'数据备份', playlist_sync:'歌单同步', comment_refresh:'评论抓取', comment_preview:'评论预览', backup:'备份',
                 merge:'歌单融合', sync:'歌单同步', restore:'恢复'};
const TK_LABEL = {queued:'排队中', running:'执行中', succeeded:'成功', partial:'部分成功',
                  limited:'被限流', failed:'失败', cancelled:'已取消', interrupted:'被中断'};
function tkLabel(status,kind){return kind==='comment_refresh'&&status==='succeeded'?'本次运行成功':(TK_LABEL[status]||status);}
const TK_CLASS = {succeeded:'ok', running:'blue', queued:'blue', limited:'warn',
                  partial:'warn', interrupted:'warn', failed:'', cancelled:''};

function tkFmtTime(ts){
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function renderTasks(){
  await loadSession();
  await tkLoad();
  await cmLoadPlan();
}

function tkRenderCommentDiagnostics(result){
  const r = result && typeof result === 'object' ? result : {};
  const sections = [];
  const add = (title, value) => {
    if (value == null || (typeof value === 'object' && !Object.keys(value).length)) return;
    sections.push(`<h4>${title}</h4><pre>${esc(typeof value === 'object' ? JSON.stringify(value,null,2) : String(value))}</pre>`);
  };
  if (Array.isArray(r.errors) && r.errors.length) {
    add('错误详情',r.errors.map(e => typeof e === 'object' && e ? [e.source || '未知平台',e.kind || e.error_kind || '错误',e.detail || e.reason || '',e.http_status ? `HTTP ${e.http_status}` : ''].filter(Boolean).join(' · ') : String(e)).join('\n'));
  }
  if (r.errors_total != null) add('错误总数',r.errors_total);
  add('错误分类计数',r.error_kinds);
  add('跳过原因计数',r.skip_reasons);
  add('平台接口状态与原因',r.provider_health);
  add('匹配诊断与原因计数（原因可重叠）',r.matching_diagnostics);
  add('平台问题',r.platform_issues);
  add('本任务覆盖诊断',r.coverage_diagnostics);
  return sections.join('') || '<div class="hint">本任务未保存详细诊断；不使用当前全局统计推断历史任务原因。</div>';
}
const TK_DIAGNOSTICS = new Map();
async function tkLoadCommentDiagnostics(el){
  if (!el.open || el.dataset.loaded) return;
  el.dataset.loaded = '1';
  const id = el.dataset.taskId, content = el.querySelector('.tk-diagnostics-content');
  const saved = TK_DIAGNOSTICS.get(id) || {};
  if (['errors','matching_diagnostics','provider_health','platform_issues','coverage_diagnostics'].some(k => saved[k] && Object.keys(saved[k]).length)) return;
  try {
    const task = await api('/api/tasks/' + encodeURIComponent(id));
    if (task.kind !== 'comment_refresh' || task.id !== id) return;
    const result = task.result || saved;
    TK_DIAGNOSTICS.set(id,result);
    content.innerHTML = tkRenderCommentDiagnostics(result);
  } catch(e) {
    content.innerHTML = tkRenderCommentDiagnostics(saved) + `<div class="hint">任务诊断读取失败：${esc(e.message)}</div>`;
  }
}

async function tkLoad(){
  const box = $('#tk-list');
  if (!box) return;
  let d;
  try{ d = await api('/api/tasks?limit=30'); }
  catch(e){ box.innerHTML = '<div class="empty">读不到任务列表：' + esc(e.message) + '</div>'; return; }
  const stats = d.stats || {}, by = stats.by_status || {};
  // current is the oldest active task on concurrent backends, not the only one.
  // An explicitly empty current_tasks is authoritative; older servers omit it.
  const active = Array.isArray(d.current_tasks) ? d.current_tasks : (d.current ? [d.current] : []);
  const pill = $('#tk-pill');
  if (pill){
    pill.textContent = active.length ? ('执行中 ' + active.length + ' 个任务') : '空闲';
    pill.title = active.join('、');
    pill.className = 'pill ' + (active.length ? 'blue' : 'ok');
  }
  const grid = $('#tk-stats');
  if (grid){
    const cell = (n, l) => '<div class="card"><div class="stat">' + n +
      '</div><div class="stat-label">' + l + '</div></div>';
    grid.innerHTML = cell(stats.total || 0, '任务总数') +
      cell(by.queued || 0, '排队中') + cell(by.running || 0, '执行中') +
      cell((by.succeeded || 0), '成功') +
      cell((by.failed || 0) + (by.partial || 0) + (by.limited || 0), '失败/部分/限流') +
      cell(by.interrupted || 0, '被中断') +
      cell(Math.round((stats.log_bytes || 0) / 1024) + ' KB', '日志占用');
  }
  const tasks = d.tasks || [];
  $('#tk-count').textContent = '共 ' + tasks.length + ' 条';
  if (!tasks.length){ box.innerHTML = '<div class="empty">还没有任务。上面点一个按钮试试。</div>'; return; }
  let html = '<table class="tk"><thead><tr><th>状态</th>' +
    '<th>类型</th><th>摘要</th><th style="width:112px">时间</th>' +
    '<th style="width:80px">操作</th></tr></thead><tbody>';
  tasks.forEach(t => {
    const st = t.status || '?';
    const retryInfo = t.next_attempt_at ? `；等待重试 ${tkFmtTime(t.next_attempt_at)}（已尝试 ${Number(t.attempt_count)||0}/3 次）` : (t.retry_count ? `；重试 ${Number(t.retry_count)} 次` : '');
    html += '<tr><td><span class="pill ' + (TK_CLASS[st] || '') + '">' +
      esc(t.next_attempt_at && st==='queued' ? '等待重试' : tkLabel(st,t.kind)) + '</span></td>' +
      '<td>' + esc(TK_KIND[t.kind] || t.kind || '') + '</td>' +
      '<td title="' + esc((t.summary || '') + retryInfo) + '">' + esc((t.summary || t.id.slice(0,10)) + retryInfo) + '</td>' +
      '<td>' + tkFmtTime(t.finished_at || t.created_at) + '</td>' +
      '<td>' + (['queued','running'].includes(st)
        ? '<button class="btn sm ghost" onclick="tkCancelId(\'' + t.id + '\')">取消</button>' : '—') + '</td></tr>';
    if (t.kind === 'comment_refresh') {
      // 诊断数据一条就上百 KB：**展开时**再用 /api/tasks/{id} 去取。
      // 以前在这里直接 tkRenderCommentDiagnostics()，一次进页面就要把十几条
      // 任务的诊断（约 17 MB 文本）全部 pretty-print 进 DOM，哪怕 <details> 是收起的。
      const cached = TK_DIAGNOSTICS.get(t.id);
      if (cached) TK_DIAGNOSTICS.set(t.id,{...(t.result||{}),...cached});
      html += `<tr class="tk-diagnostics-row"><td colspan="5"><details class="tk-diagnostics" data-task-id="${esc(t.id)}" ontoggle="tkLoadCommentDiagnostics(this)"><summary>本任务错误与平台诊断</summary><div class="tk-diagnostics-content"><div class="hint">展开后加载…</div></div></details></td></tr>`;
    }
  });
  html += '</tbody></table>';
  box.innerHTML = html;
}

async function tkCancelId(id){
  try{ await apiWrite('/api/tasks/' + id + '/cancel'); tkMsg('已请求取消 ' + id.slice(0,8)); }
  catch(e){ tkMsg('取消失败：' + e.message, true); }
  tkLoad();
}

/* ---------------- 评论刷新 ---------------- */
function cmOpts(){
  return {platform: ($('#cm-plat')||{}).value || null,
          comment_count: Math.max(1, parseInt(($('#cm-count')||{}).value || '100', 10) || 100),
          batch_size: Math.max(1, Math.min(20, parseInt(($('#cm-limit')||{}).value || '5', 10) || 5)),
          full_library: true,
          platform_fill: !!(($('#cm-plat')||{}).value)};
}
async function cmRefresh(){
  try{ const t=await apiWrite('/api/comments/refresh',cmOpts()); await Promise.all([tkLoad(), cmLoadProgress()]); }
  catch(e){tkMsg('提交失败：'+e.message,true);}
}
async function cmLoadPlan(){
  try{
     const d=await api('/api/comments/plan');
     const p=d.plan||{}, sp=p.spec||{}, sw=$('#cm-sw');
     if(sw)sw.className='sw'+(p.enabled?' on':'');
     if($('#cm-frequency'))$('#cm-frequency').value=sp.frequency||'daily';
     if($('#cm-weekday'))$('#cm-weekday').value=sp.weekday==null?'0':sp.weekday;
     if($('#cm-day'))$('#cm-day').value=sp.day||1;
     syncCadenceFields('cm');
    if ($('#cm-hour')) $('#cm-hour').value = sp.hour == null ? 4 : sp.hour;
    if ($('#cm-min')) $('#cm-min').value = sp.minute == null ? 0 : sp.minute;
    if ($('#cm-limit') && !$('#cm-limit').dataset.touched) $('#cm-limit').value = sp.batch_size || 5;
    if ($('#cm-count') && !$('#cm-count').dataset.touched) $('#cm-count').value = sp.comment_count || 100;
    if ($('#cm-plat') && !$('#cm-plat').dataset.touched) {
      $('#cm-plat').value = sp.platform || '';
      syncCustomSelect($('#cm-plat'));
    }
    const cd = d.cooldown || {};
    const el = $('#cm-cooldown');
    if (el){
      el.textContent = cd.remaining > 0
        ? ('冷却中，剩 ' + Math.ceil(cd.remaining / 60) + ' 分钟（' + (cd.reason || '') + '）')
        : '未冷却';
      el.style.color = cd.remaining > 0 ? 'var(--amber)' : '';
    }
  }catch(e){ /* 计划读不到不影响其它 */ }
}
async function cmToggle(){
  const sw = $('#cm-sw');
  const next = !sw.classList.contains('on');
  sw.className = 'sw' + (next ? ' on' : '');
  await cmSavePlan(next);
}
async function cmSavePlan(explicitEnabled){
  const body = cmOpts();
  body.frequency = $('#cm-frequency').value;
  body.weekday = Number($('#cm-weekday').value || 0);
  body.day = Number($('#cm-day').value || 1);
  body.hour = parseInt(($('#cm-hour')||{}).value || '4', 10);
  body.minute = parseInt(($('#cm-min')||{}).value || '0', 10);
  body.enabled = (explicitEnabled === undefined)
    ? $('#cm-sw').classList.contains('on') : explicitEnabled;

/* ---------- ④ 建组/改组之后，自动把这个组的成员排到一起 ---------- */
async function autoPack(user, name){
  const g = (S.merges_cfg || []).find(x => x.fn_user === user && x.name === name);
  if (!g) return;
  const ids = (g.sources || []).map(s => `${s.platform}:${s.id}`);
  const exist = new Set((G.sources || []).map(s => s.id));
  const members = ids.filter(id => exist.has(id));
  if (members.length < 2) return;                    // 只有一个来源，没什么可排
  const all = globalOrder('src');
  const memSet = new Set(members);
  const pos = all.map((id, i) => (memSet.has(id) ? i : -1)).filter(i => i >= 0);
  if (pos.every((v, k) => k === 0 || v === pos[k - 1] + 1)) return;   // 已经在一起了
  const ordered = all.filter(id => memSet.has(id));
  const rest = all.filter(id => !memSet.has(id));
  let insertAt = rest.length;
  for (let i = 0; i < rest.length; i++) {
    if (all.indexOf(rest[i]) > pos[0]) { insertAt = i; break; }
  }
  const out = rest.slice(0, insertAt).concat(ordered, rest.slice(insertAt));
  try {
    await api('/api/save-order', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sources: out, targets: savedOrder('targets')})});
  } catch(e) { /* 排序失败不影响主流程 */ }
}

/* ---------- 排版：账户 → 平台块 → 歌单（融合组成员凑成连续几行） ---------- */
function layoutGraph(){
  const byS = {};
  G.sources.forEach(s => byS[s.id] = s);
  GR.byS = byS;
  const rows = [], tgtRows = {};
  const rowOf = {};
  const last = () => rows[rows.length - 1];
  const gap = h => {
    if (last() && last().type === 'gap') { last().h = Math.max(last().h, h); return; }
    rows.push({type:'gap', h});
  };
  // 每一行记住这个来源的全部目标（一个来源可能既同步成自己的歌单，又是某个融合组的成员）
  const pushRow = (src, tgt) => {
    const ri = rows.length;
    rows.push({type:'row', h:ROW_H, src:src, tgt:tgt,
               tgts: src ? (byS[src].targets || []).slice() : []});
    if (src) rowOf[src] = ri;
    return ri;
  };

  const so = savedOrder('sources');
  const six = {};
  so.forEach((id, i) => six[id] = i);
  (GACC ? [GACC] : G.order).forEach(acc => {
    // 稳定排序：手动排过序的按 order.json，没排过的保持后端顺序
    const mine = G.sources.filter(s => s.fn_user === acc).slice()
      .sort((a, b) => (six[a.id] ?? 1e9) - (six[b.id] ?? 1e9));
    const un = G.targets.filter(t => (t.kind === 'untracked' || t.kind === 'favorite') && t.fn_user === acc);
    if (!mine.length && !un.length) return;
    if (!GACC && G.order.length > 1) rows.push({type:'acc', h:ACC_H, name:acc});

    // ① 融合优先：融合组整块排出来。
    //    每个来源**只占一行**（左列永远唯一）；同时属于多个融合组时，
    //    这一行会向多个目标各连一根线，线可以交叉。
    const gs = G.groups.filter(g => g.fn_user === acc);
    (GR.groupFirst ? gs : []).forEach(g => {
      const members = (g.sources || []).filter(id => byS[id])
        .map(id => byS[id])
        .sort((a, b) => (six[a.id] ?? 1e9) - (six[b.id] ?? 1e9));
      if (!members.length) return;
      gap(GAP_MERGE);
      // 左列唯一：已经在别的块里排过的来源不再占一行，复用那一行去连这个目标
      const idxs = members.map(o => rowOf[o.id] != null
        ? rowOf[o.id] : pushRow(o.id, g.target));
      tgtRows[g.target] = (tgtRows[g.target] || []).concat(idxs);
      gap(GAP_MERGE);
    });

    // ② 剩下的来源按顺序排。
    //    默认顺序是「平台 → 名称」，平台之间留一点空隙；
    //    但**同属一个融合组的相邻来源不能被平台空隙拆开**（否则色带就没了），
    //    而且融合组那一段前后要留出融合留白（色带才不贴邻居）
    const inMerge = new Set(GR.groupFirst
      ? gs.reduce((a, g) => a.concat(g.sources || []), []) : []);
    const list = mine.filter(s => !inMerge.has(s.id));
    const sameGroup = (a, b) => a && b && gs.some(g =>
      (g.sources || []).indexOf(a) >= 0 && (g.sources || []).indexOf(b) >= 0);
    const shares = list.map((s, i) => i > 0 && sameGroup(s.id, list[i - 1].id));
    const inRun = list.map((s, i) => shares[i] || shares[i + 1] || false);
    list.forEach((s, i) => {
      if (i > 0 && !shares[i]) {
        if (inRun[i - 1] || inRun[i]) gap(GAP_MERGE);          // 融合段边界 → 多留点
        else if (list[i - 1].platform !== s.platform) gap(GAP_PLAT);
      } else if (i === 0 && inRun[0]) {
        gap(GAP_MERGE);
      }
      const t = (s.targets || [])[0] ? GR.byT[s.targets[0]] : null;
      pushRow(s.id, t ? t.id : null);
    });
    if (inRun.length && inRun[inRun.length - 1]) gap(GAP_MERGE);

    // ③ 最后是「飞牛里已有、但工具不知道」的歌单
    if (un.length) {
      gap(GAP_PLAT);
      rows.push({type:'acc', h:ACC_H,
                 name:'飞牛音乐'});
      un.forEach(t => { tgtRows[t.id] = [pushRow(null, t.id)]; });
    }
    rows.push({type:'gap', h:GAP_PLAT});
  });

  // ---- 目标纵坐标：每个目标独独占一个「行位」，两两至少隔一行 ----
  //      （以前是取成员行的平均值，两个目标可能算到同一个 y 上互相压盖）
  Object.keys(tgtRows).forEach(tid => {
    const ids = tgtRows[tid].filter(i => rows[i]);
    if (!ids.length) { delete tgtRows[tid]; return; }
    const yAvg = ids.reduce((a, i) => a + nodeY_of(rows, i), 0) / ids.length;
    tgtRows[tid] = {rows: ids, want: yAvg};
  });
  G.targets.forEach(t => {
    if (tgtRows[t.id]) return;
    const ids = (t.sources || []).map(id => rowOf[id]).filter(v => v != null);
    if (!ids.length) return;
    const yAvg = ids.reduce((a, i) => a + nodeY_of(rows, i), 0) / ids.length;
    tgtRows[t.id] = {rows: ids, want: yAvg};
  });

  // 行位分两段，各用各的，互不越界：
  //   · 来源区（上面）→ 已纳管的目标
  //   · 未接入区（最下面「飞牛音乐」）→ 未接入的目标，各自占自己那一行
  // 已纳管的目标**就近占一个还空着的行位**，不再「依次 +1 顺延」——
  // 一旦有两个目标想要同一个行位，顺延就会把它们一路往下推，
  // 推着推着就压进了最下面「飞牛音乐」那一区。
  const srcSlots = [], unSlots = [];
  rows.forEach((r, i) => {
    if (r.type === 'row') (r.src ? srcSlots : unSlots).push(i);
  });
  const slotY = i => nodeY_of(rows, i);
  const tgtY = {};
  Object.keys(tgtRows).forEach(tid => {           // 未接入的先各就各位
    const t = GR.byT[tid];
    if (t && (t.kind === 'untracked' || t.kind === 'favorite')) tgtY[tid] = tgtRows[tid].want;
  });
  const free = new Set(srcSlots);
  const to = savedOrder('targets');
  const tix = {};
  to.forEach((id, k) => tix[id] = k);
  const tracked = Object.keys(tgtRows).filter(tid => tgtY[tid] == null);
  tracked.sort((a, b) => (tix[a] != null || tix[b] != null)
    ? ((tix[a] ?? 1e9) - (tix[b] ?? 1e9) || tgtRows[a].want - tgtRows[b].want)
    : (tgtRows[a].want - tgtRows[b].want));
  tracked.forEach(tid => {
    const w = tgtRows[tid].want;
    let best = null, bd = Infinity;
    srcSlots.forEach(k => {
      if (!free.has(k)) return;
      const d = Math.abs(slotY(k) - w);
      if (d < bd) { bd = d; best = k; }
    });
    if (best == null) { tgtY[tid] = w; return; }  // 行位真不够了，就放在想要的位置
    free.delete(best);
    tgtY[tid] = slotY(best);
  });
  const rowsOf = {};
  Object.keys(tgtRows).forEach(tid => rowsOf[tid] = tgtRows[tid].rows);

  GR.rows = rows; GR.tgtY = tgtY; GR.tgtRows = rowsOf; GR.rowOf = rowOf;
}

/* 手动排序：拖拽预览 > order.json（没列出的排后面，保持原顺序） */
function savedOrder(kind){
  const p = GR.preview && GR.preview[kind];
  if (Array.isArray(p)) return p;
  const o = (G.order_cfg || {})[kind];
  return Array.isArray(o) ? o : [];
}
const reordering = () => !!(GR.reorder && GR.reorder.on);
/* 连线的 d：三次贝塞尔，两个 y 决定形状；抽出来给「重画」和「实时改坐标」共用 */
function wireD(y1, y2){
  const x1 = L_X + LW, x2 = R_X;
  const dx = Math.max(70, (x2 - x1) * 0.5);
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}
/* 只重画，不动缩放/平移（免得视角乱跳）。
   节点整体重建一次比较费（近百个 DOM + 近百条 SVG），所以只在
   「结构真的变了」或者「一次拖拽结束」时用；拖拽过程中走 relayoutFast */
function redrawOnly(){
  updateStats();
  layoutGraph(); computeYs(); buildNodes(); drawWires(); drawBands();
  paintAllProg();
  if (reordering()) clearHot(); else applySearch();
  renderSelbar(); applyT();
}

/* 当前 DOM 里都有哪些节点/连线（排序无关，只看集合） */
function domKeys(){
  const s = a => a.slice().sort().join(',');
  return s(Object.keys(GR.L)) + '|' + s(Object.keys(GR.R)) + '|' + s(Object.keys(GR.wireEl));
}
function wantKeys(){
  const s = a => a.slice().sort().join(',');
  const L = [], E = [];
  GR.rows.forEach(r => {
    if (r.type !== 'row' || !r.src) return;
    L.push(r.src);
    (r.tgts || []).forEach(tid => { if (GR.tgtY[tid] != null) E.push(r.src + '|' + tid); });
  });
  return s(L) + '|' + s(Object.keys(GR.tgtY)) + '|' + s(E);
}

/* 拖拽过程中的「实时让位」：节点和连线一张都不新建、不删除，
   只把已经存在的元素挪到新坐标上。这样既不会闪、也不会因为
   反复重建 DOM 而丢掉中间的连线，而且基本零开销。 */
function relayoutFast(){
  updateStats();
  layoutGraph(); computeYs();
  if (domKeys() !== wantKeys()) {          // 结构真的变了 → 老老实实全量重画
    buildNodes(); drawWires(); drawBands();
  } else {
    repositionAll();
  }
  if (reordering()) clearHot(); else applySearch();
  renderSelbar(); applyT();
}

/* 只改坐标：左侧来源行、右侧目标、分区标题、连线、色带 */
function repositionAll(){
  // 每个来源行 → 内容坐标里的中心 y（连线两端都要用）
  const yc = {};
  GR.rows.forEach((r, i) => {
    if (r.type !== 'row') return;
    if (r.src) {
      const y = nodeY(i);
      yc[r.src] = y + NODE_H / 2;
      const n = GR.L[r.src];
      if (n) { n.style.top = y + 'px'; n.dataset.row = i; }
    }
  });
  Object.keys(GR.R).forEach(tid => {
    const y = GR.tgtY[tid];
    if (y != null) GR.R[tid].style.top = y + 'px';
  });
  GR.rows.forEach((r, i) => {
    if (r.type === 'acc' && GR.accEl[r.name]) GR.accEl[r.name].style.top = (GR.y[i] + 12) + 'px';
  });
  GR.rowYc = yc;
  repositionWires();
  repositionBands();
  $('#wires').setAttribute('height', GR.total);
  GR.stamp++;
}
function repositionWires(){
  const yc = GR.rowYc || {};
  Object.keys(GR.wireEl || {}).forEach(k => {
    const i = k.indexOf('|');
    const sid = k.slice(0, i), tid = k.slice(i + 1);
    const y1 = yc[sid], y2 = GR.tgtY[tid];
    if (y1 == null || y2 == null) return;
    const d = wireD(y1, y2 + NODE_H / 2);
    const w = GR.wireEl[k];
    w.p.setAttribute('d', d);
    w.hit.setAttribute('d', d);
  });
}
/* 色带：能原地改坐标就改，连续性命中不了就先藏起来 */
function repositionBands(){
  if (!GR.groupOn) return;
  G.groups.forEach(g => {
    const el = GR.bandEl && GR.bandEl[g.target];
    if (!el) return;
    const idxs = (GR.tgtRows[g.target] || []).slice().sort((a, b) => a - b);
    const contig = idxs.length >= 2 && idxs.every((v, k) => k === 0 || v === idxs[k - 1] + 1);
    if (!contig) { el.style.display = 'none'; return; }
    el.style.display = '';
    const top = nodeY(idxs[0]) - 12;
    const bot = nodeY(idxs[idxs.length - 1]) + NODE_H + 12;
    el.style.top = top + 'px';
    el.style.height = (bot - top) + 'px';
  });
}

/* 用「已累积的行高」算某个行的节点顶部（供目标居中；与 computeYs 同一套算法） */
function nodeY_of(rows, idx){
  let acc = TOP;
  for (let i = 0; i < idx; i++) acc += rows[i].h;
  return acc + (rows[idx].h - NODE_H) / 2;
}

function computeYs(){
  let acc = TOP;
  GR.rows.forEach((r, i) => { GR.y[i] = acc; GR.hgt[i] = r.h; acc += r.h; });
  GR.total = acc + 24;
}

/* ---------- 节点 ---------- */
function buildNodes(){
  const vp = $('#viewport');
  vp.querySelectorAll('.g-node,.band,.band-label,.g-acc').forEach(e => e.remove());
  GR.L = {}; GR.R = {}; GR.P = {}; GR.accEl = {};
  const frag = document.createDocumentFragment();

  GR.rows.forEach((r, i) => {
    if (r.type === 'acc') {
      const sep = document.createElement('div');
      sep.className = 'g-acc';
      sep.style.cssText = `left:${L_X}px;top:${GR.y[i] + 12}px;width:${R_X + RW - L_X}px`;
      sep.innerHTML = `<span class="tag">${esc(r.name)}</span>`;
      frag.appendChild(sep);
      GR.accEl[r.name] = sep;
      return;
    }
    if (r.type !== 'row') return;
    if (!r.src) return;
    const s = GR.byS[r.src];
    const t = r.tgt ? GR.byT[r.tgt] : null;
    const merged = !!t && (t.kind === 'merge' || t.sources.length > 1);
    const renamed = !!t && t.name !== s.name;
    const n = document.createElement('div');
    n.className = 'g-node left';
    n.dataset.src = s.id;
    n.dataset.row = i;
    n.style.cssText = `left:${L_X}px;top:${nodeY(i)}px;width:${LW}px;`
      + `color:${merged ? (GR.gcolor[t.id] || '#ffb454') : '#4d8dff'}`;
    const gsOf = G.groups.filter(g => (g.sources || []).indexOf(s.id) >= 0);
    if (gsOf.length) {
      n.classList.add('in-group');
      n.style.borderLeftColor = GR.gcolor[gsOf[0].target] || '#ffb454';
    }
    // 已经在「歌单列表」里勾上、但还没同步到飞牛音乐的来源：虚线 + 一个「未同步」小标
    if (s.synced === false) n.classList.add('pending');
    // 平台上已经删掉的来源：虚线 + 告警红 + 一个 ✕（点掉就等于把连接摘了）
    if (s.missing) n.classList.add('missing');
    n.innerHTML = pic(s.platform)
      + `<span class="nm">${esc(s.name)}</span>`
      + (s.missing
          ? `<span class="sub">源已删</span><span class="tag">源已删除</span>`
          : s.synced === false
            ? `<span class="sub">未同步</span><span class="tag">未同步</span>`
            : `<span class="sub">${renamed ? '✎ ' : ''}${s.count} 首</span>`)
      + (s.missing && (s.targets || []).length
          ? `<button class="xdel" title="从融合里摘掉这个来源">✕</button>` : '')
      + `<span class="port"></span>`;
    n.title = s.missing
      ? `这个歌单在${platName(s.platform)}上已经找不到了 —— 点右上角的 ✕ 把它从融合里摘掉`
        + `（飞牛音乐里那张歌单会保留，退回「未接入」）`
      : s.synced === false
        ? '还没同步到飞牛音乐 —— 可以先拖进融合组，也可以去「歌单同步 → 手动同步」把它建出来'
        : '';
    n.onmouseenter = () => { if (!GR.dragActive && !reordering()) highlight('src', s.id); };
    n.onmouseleave = () => { if (!searchKw() && !GR.dragActive && !reordering()) clearHot(); };
    n.onclick = () => { if (GR.clickOk && !GR.dragActive) toggleSel(s.id); };
    const xb = n.querySelector('.xdel');
    if (xb) xb.onclick = ev => { ev.stopPropagation(); dropMissingSource(s); };
    frag.appendChild(n);
    GR.L[s.id] = n;
  });

  // 目标节点
  Object.keys(GR.tgtY).forEach(tid => {
    const t = GR.byT[tid];
    if (!t) return;
    const merged = t.kind === 'merge' || t.sources.length > 1;
    const unt = t.kind === 'untracked';
    const n = document.createElement('div');
    n.className = 'g-node right' + (merged ? ' merged' : '') + (unt ? ' untracked' : '');
    n.dataset.tgt = t.id;
    n.style.cssText = `left:${R_X}px;top:${GR.tgtY[tid]}px;width:${RW}px`;
    const canCancel = !t.favorite && (t.kind === 'merge' || t.sources.length > 1);
    const canEditTarget = !t.favorite;
    n.innerHTML = (merged ? `<span class="badge">${t.sources.length}</span>` : '')
      + `<span class="port"></span><span class="nm">${esc(t.name)}</span>`
      + `<span class="sub${GR.cards[t.id] ? ' pgsub' : ''}">`
      + `${esc(cardSub(t.id, GR.cards[t.id]))}</span>`
      + (unt ? '<span class="tag">未接入</span>' : '')
      + `<button type="button" class="more" aria-label="歌单选项" aria-haspopup="menu" aria-expanded="false">⋯</button>`
      + `<div class="node-menu" role="menu">`
      + `<button type="button" role="menuitem" data-action="add-source"${canEditTarget?'':' disabled title="收藏是飞牛音乐的系统列表，不能作为融合目标"'}>添加来源</button>`
      + `<button type="button" role="menuitem" data-action="cancel-merge"${canCancel?'':' disabled title="该歌单当前不是融合歌单"'}>取消融合</button>`
      + `<button type="button" role="menuitem" data-action="delete-playlist" class="danger"${canEditTarget?'':' disabled title="收藏是飞牛音乐的系统列表，不能删除"'}>删除歌单</button></div>`;
    n.onmouseenter = () => { if (!GR.dragActive && !reordering()) highlight('tgt', t.id); };
    n.onmouseleave = () => { if (!searchKw() && !GR.dragActive && !reordering()) clearHot(); };
    n.ondblclick = e => { if (!e.target.closest('.more,.node-menu') && GR.clickOk) inlineRename(t.id); };
    n.onclick = e => {
      if (!GR.clickOk) return;
      const more=e.target.closest('.more'), action=e.target.closest('.node-menu button');
      if(more){
        e.stopPropagation();const open=n.classList.toggle('menu-open');more.setAttribute('aria-expanded',open?'true':'false');
        const menu=n.querySelector('.node-menu');if(menu){menu.classList.remove('menu-up');if(open)requestAnimationFrame(()=>{if(!n.isConnected||!n.classList.contains('menu-open'))return;const stage=$('#stage').getBoundingClientRect(),nr=n.getBoundingClientRect(),mr=menu.getBoundingClientRect(),below=stage.bottom-nr.bottom,above=nr.top-stage.top;if(mr.bottom>stage.bottom-8&&above>below)menu.classList.add('menu-up');});}
        return;
      }
      if(action){e.stopPropagation();n.classList.remove('menu-open');n.querySelector('.more').setAttribute('aria-expanded','false');handleTargetMenuAction(t.id,action.dataset.action);return;}
    };
    frag.appendChild(n);
    GR.R[t.id] = n;
  });

  vp.appendChild(frag);
}

/* ---------- 连线：三次贝塞尔；融合的线同色 + 流动 ---------- */
function drawWires(){
  const w = $('#wires');
  w.querySelectorAll('path.wire,path.hit').forEach(e => e.remove());
  w.setAttribute('width', GW);
  w.setAttribute('height', GR.total);
  GR.edges = {}; GR.edgesT = {}; GR.wireEl = {};
  const yc = GR.rowYc = {};
  GR.rows.forEach((r, i) => {
    if (r.type !== 'row' || !r.src) return;
    const y1 = nodeY(i) + NODE_H / 2;
    yc[r.src] = y1;
    (r.tgts || []).forEach(tid => {
      const t = GR.byT[tid];
      if (!t || GR.tgtY[tid] == null) return;
      const merged = t.kind === 'merge' || t.sources.length > 1;
      const y2 = GR.tgtY[tid] + NODE_H / 2;
      const d = wireD(y1, y2);
      const p = document.createElementNS(NSU, 'path');
      p.setAttribute('class', 'wire');
      p.dataset.src = r.src;           // 这根线从哪来 / 到哪去（实时改坐标要用）
      p.dataset.tgt = tid;
      p.setAttribute('d', d);
      p.setAttribute('stroke', merged ? (GR.gcolor[t.id] || '#ffb454') : '#4d8dff');
      p.setAttribute('stroke-width', merged ? 1.7 : 1.25);
      p.setAttribute('opacity', merged ? .85 : .45);
      if (!t.synced) p.setAttribute('stroke-dasharray', '2 5');
      if (merged) {
        p.dataset.merged = '1';
        if (GR.flowOn) p.classList.add('flow');
      }
      // 先放一条透明的粗线当点击热区（细线本身太难点中）
      const hit = document.createElementNS(NSU, 'path');
      hit.setAttribute('class', 'hit');
      hit.setAttribute('d', d);
      hit.dataset.src = r.src;
      hit.dataset.tgt = tid;
      hit.onclick = ev => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        // 刚才是在拖屏幕（或者手抖挪了几像素），不是想断开这根线 ——
        // 热区有 14px 宽，拖屏幕时很容易一不小心按在线上
        if (!GR.clickOk || GR.moved >= 5) return;
        askCut(r.src, tid);
      };
      hit.onmouseenter = () => { if (!GR.dragging) p.classList.add('hold'); };
      hit.onmouseleave = () => p.classList.remove('hold');
      w.appendChild(hit);
      w.appendChild(p);
      GR.wireEl[r.src + '|' + tid] = {p: p, hit: hit};
      (GR.edges[r.src] = GR.edges[r.src] || []).push(p);
      (GR.edgesT[tid] = GR.edgesT[tid] || []).push(p);
    });
  });
}

/* ---------- 融合色带：前后已预留空白，不会压到邻居 ---------- */
function drawBands(){
  const vp = $('#viewport');
  vp.querySelectorAll('.band').forEach(e => e.remove());
  GR.bandEl = {};
  if (!GR.groupOn) return;
  const anchor = vp.querySelector('.g-node');
  if (!anchor) return;
  G.groups.forEach(g => {
    const idxs = GR.tgtRows[g.target];
    if (!idxs || idxs.length < 2) return;
    const sorted = idxs.slice().sort((a, b) => a - b);
    if (!sorted.every((v, k) => k === 0 || v === sorted[k - 1] + 1)) return;
    const top = nodeY(Math.min(...idxs)) - 12;
    const bottom = nodeY(Math.max(...idxs)) + NODE_H + 12;
    const col = GR.gcolor[g.target] || '#ffb454';
    const b = document.createElement('div');
    b.className = 'band'; b.dataset.target = g.target;
    b.style.cssText = `left:${L_X - 13}px;top:${top}px;width:${LW + 26}px;`
      + `height:${bottom - top}px;border-color:${col}44;`
      + `background:linear-gradient(90deg,${col}18,${col}05)`;
    vp.insertBefore(b, anchor);
    GR.bandEl[g.target] = b;
  });
}

/* ---------- 悬停高亮 ---------- */
/* 只清「点亮」，不动搜索造成的变暗 */
function clearSpot(){
  $$('#viewport .g-node.hot').forEach(n => n.classList.remove('hot'));
  $$('#wires path.wire.hot').forEach(p => p.classList.remove('hot'));
}
function clearHot(){
  clearSpot();
  $$('#viewport .g-node.dim').forEach(n => n.classList.remove('dim'));
  $$('#wires path.wire').forEach(p => p.style.opacity = '');
  $$('#viewport .band').forEach(b => b.style.opacity = '1');
}
/* 悬停：**只有鼠标底下这一张**点亮，它的连线跟着亮一下。
   别的卡片一律保持原样 —— 不变暗、不变色。
   （想在一片歌单里只看某条线连去哪儿，看线的亮灭就够了） */
function highlight(kind, id){
  clearSpot();
  let edges = [];
  if (kind === 'src') {
    const s = GR.byS[id]; if (!s) return;
    if (GR.L[id]) GR.L[id].classList.add('hot');
    edges = GR.edges[id] || [];
  } else {
    const t = GR.byT[id]; if (!t) return;
    if (GR.R[id]) GR.R[id].classList.add('hot');
    edges = GR.edgesT[id] || [];
  }
  edges.forEach(p => p.classList.add('hot'));
}

/* ---------- 搜索 ---------- */
function applySearch(){
  const kw = searchKw();
  if (!kw) { clearHot(); return; }
  const hitS = new Set(), hitT = new Set();
  G.sources.forEach(s => {
    if ((s.name + ' ' + (s.pid || '')).toLowerCase().indexOf(kw) >= 0) {
      hitS.add(s.id); (s.targets || []).forEach(t => hitT.add(t));
    }
  });
  G.targets.forEach(t => {
    if (t.name.toLowerCase().indexOf(kw) >= 0) {
      hitT.add(t.id); t.sources.forEach(x => hitS.add(x));
    }
  });
  Object.keys(GR.L).forEach(k => {
    const on = hitS.has(k);
    GR.L[k].classList.toggle('dim', !on);
    if (on) GR.L[k].classList.add('hot');
  });
  Object.keys(GR.R).forEach(k => {
    const on = hitT.has(k);
    GR.R[k].classList.toggle('dim', !on);
    if (on) GR.R[k].classList.add('hot');
  });
  Object.keys(GR.edges).forEach(k =>
    GR.edges[k].forEach(p => p.style.opacity = hitS.has(k) ? '1' : '.07'));
  $$('#viewport .band').forEach(b =>
    b.style.opacity = hitT.has(b.dataset.target) ? '1' : '.08');
}

/* ---------- 缩放 / 平移 ---------- */
/* 内容四周留的内边距 */
const PAD_X = 30, PAD_Y = 18;
const stageSize = () => {
  const s = $('#stage');
  return {W: s.clientWidth || 900, H: s.clientHeight || 600};
};

/* 把画面夹住，别彻底拖丢。
   loose（拖拽时）只要求留一点在视野里 —— 不然按宽度铺满之后根本拖不动 */
function clampPan(loose){
  const {W, H} = stageSize();
  // 横向按「两列」的范围算：节点从 CL 排到 CR，居中/夹边都要带上这个偏移
  const cw = CW_ * GR.scale, ch = GR.total * GR.scale;
  if (loose) {
    const keep = 90;
    const cwAll = GW * GR.scale;
    GR.tx = Math.min(W - keep, Math.max(keep - cwAll, GR.tx));
    GR.ty = Math.min(H - keep, Math.max(keep - ch, GR.ty));
    return;
  }
  if (cw + PAD_X * 2 <= W) GR.tx = (W - cw) / 2 - CL * GR.scale;
  else GR.tx = Math.min(PAD_X - CL * GR.scale,
                        Math.max(W - PAD_X - CR * GR.scale, GR.tx));
  if (ch + PAD_Y * 2 <= H) GR.ty = (H - ch) / 2;
  else GR.ty = Math.min(PAD_Y, Math.max(H - ch - PAD_Y, GR.ty));
}
function applyT(loose){
  clampPan(loose);
  $('#viewport').style.transform =
    `translate(${GR.tx}px,${GR.ty}px) scale(${GR.scale})`;
  GR.stamp++;          // 视角一动，节点的屏幕中线就全变了，缓存作废
}
function fitGraph(full){
  const {W, H} = stageSize();
  const ch = GR.total || 600;
  // 只看「两列」真正占的宽度：把 1440 的内容带减掉两侧留白，就是两列该有的宽度
  const fitW = (Math.min(W, BAND_MAX) - PAD_X * 2) / CW_;
  if (full) {
    // 「适应窗口」：整张图都塞进来（看全貌用）
    GR.scale = Math.max(.18, Math.min(fitW, (H - PAD_Y * 2) / ch));
  } else {
    // 默认：宽度铺满内容带后再缩一级，纵向该滚就滚
    GR.scale = Math.max(.18, Math.min(1.4, fitW * FIT_STEP));
  }
  GR.minScale = Math.max(.15, Math.min(GR.scale, (H - PAD_Y * 2) / ch) * .6);
  // 位置交给 clampPan 统一算（内容比画布窄就居中，否则夹在留白里）
  GR.tx = (W - CW_ * GR.scale) / 2 - CL * GR.scale;
  GR.ty = PAD_Y;
  applyT();
}
function zoomBy(k){
  const stage = $('#stage'), r = stage.getBoundingClientRect();
  const mx = r.width / 2, my = r.height / 2;
  const ns = Math.max(GR.minScale, Math.min(3, GR.scale * k));
  GR.tx = mx - (mx - GR.tx) * (ns / GR.scale);
  GR.ty = my - (my - GR.ty) * (ns / GR.scale);
  GR.scale = ns; applyT();
}
function toggleGroups(){
  GR.groupOn = !GR.groupOn;
  $('#g-bgroup').classList.toggle('on', GR.groupOn);
  drawBands();
}
function toggleFlow(){
  GR.flowOn = !GR.flowOn;
  $('#g-bflow').classList.toggle('on', GR.flowOn);
  $$('#wires path.wire').forEach(p => {
    if (p.dataset.merged) p.classList.toggle('flow', GR.flowOn);
  });
}

/* ---------- 拖拽连线：从来源节点拖到飞牛歌单上 ---------- */
function viewportPoint(clientX, clientY){
  const r = $('#stage').getBoundingClientRect();
  return {x: (clientX - r.left - GR.tx) / GR.scale,
          y: (clientY - r.top - GR.ty) / GR.scale};
}
function beginConnect(sid){
  const node = GR.L[sid]; if (!node) return;
  GR.dragActive = true;
  clearHot();
  const scr = GR.dragRow != null ? GR.dragRow
    : GR.rows.findIndex(r => r.type === 'row' && r.src === sid);
  GR.dragFrom = {x: L_X + LW, y: nodeY(scr) + NODE_H / 2};
  const p = document.createElementNS(NSU, 'path');
  p.setAttribute('class', 'wire temp');
  p.setAttribute('d', `M ${GR.dragFrom.x} ${GR.dragFrom.y} L ${GR.dragFrom.x} ${GR.dragFrom.y}`);
  $('#wires').appendChild(p);
  GR.temp = p;
  node.classList.add('dragging');
  Object.keys(GR.R).forEach(k => GR.R[k].classList.add('dropok'));
  $('#g-hint').textContent = '松手落到右边的飞牛歌单上，就把它并进那个融合组';
}
function updateConnect(clientX, clientY){
  if (!GR.temp) return;
  const pt = viewportPoint(clientX, clientY);
  const x2 = Math.max(GR.dragFrom.x + 30, pt.x);
  const dx = Math.max(40, (x2 - GR.dragFrom.x) * .5);
  GR.temp.setAttribute('d',
    `M ${GR.dragFrom.x} ${GR.dragFrom.y} C ${GR.dragFrom.x + dx} ${GR.dragFrom.y}, `
    + `${x2 - dx} ${pt.y}, ${x2} ${pt.y}`);
  const under = nodeUnder(clientX, clientY);
  Object.keys(GR.R).forEach(k => GR.R[k].classList.toggle('drophot', !!under && under === GR.R[k]));
  // 拖到上下边缘附近就慢慢自动滚，方便够到屏幕外的歌单
  const r = $('#stage').getBoundingClientRect();
  const ZONE = 90;
  let e = 0;
  if (clientY < r.top + ZONE) e = -((r.top + ZONE - clientY) / ZONE);
  else if (clientY > r.bottom - ZONE) e = ((clientY - (r.bottom - ZONE)) / ZONE);
  GR.edge = Math.max(-1, Math.min(1, e));
  if (GR.edge && !GR.edgeRAF) GR.edgeRAF = requestAnimationFrame(edgeScrollStep);
}
/* 每帧只挪 2.4px（约 145px/秒），越靠边越快，不会一滑就飞过去 */
function edgeScrollStep(){
  if ((!GR.dragActive && !(GR.reorder && GR.reorder.on)) || !GR.edge) {
    GR.edgeRAF = null; return;
  }
  GR.ty -= GR.edge * 2.4;
  applyT(true);
  // 画面在动、鼠标没动 —— 被拖的卡片和它的线要重新贴回光标下面
  if (GR.reorder && GR.reorder.on) updateReorder(GR.lastY);
  GR.edgeRAF = requestAnimationFrame(edgeScrollStep);
}
function nodeUnder(clientX, clientY){
  if (!document.elementFromPoint) return null;
  const el = document.elementFromPoint(clientX, clientY);
  const n = el && el.closest ? el.closest('.g-node.right') : null;
  return n || null;
}
function endConnect(clientX, clientY){
  const under = nodeUnder(clientX, clientY);
  const sid = GR.dragSrc;
  Object.keys(GR.R).forEach(k => GR.R[k].classList.remove('dropok', 'drophot'));
  $$('#viewport .g-node.dragging').forEach(n => n.classList.remove('dragging'));
  if (GR.temp && GR.temp.parentNode) GR.temp.parentNode.removeChild(GR.temp);
  GR.temp = null; GR.dragActive = false;
  GR.edge = 0;
  if (GR.edgeRAF) { cancelAnimationFrame(GR.edgeRAF); GR.edgeRAF = null; }
  renderSelbar();
  if (under && sid) connectTo(sid, under.dataset.tgt);
}

async function connectTo(sid, tid){
  const s = GR.byS[sid], t = GR.byT[tid];
  if (!s || !t) return;
  if ((t.sources || []).indexOf(sid) >= 0)
    return toast(`「${s.name}」已经在「${t.name}」里了`);
  // 简单确认：接入来源时默认保留歌单内已有歌曲。
  if (t.kind === 'untracked') {
    const yes = await gAsk({title:`确认接入「${t.name}」？`,html:`将「${esc(s.name)}」加入融合，保留现有 ${t.count} 首歌曲。`,ok:'确认接入',cancel:'取消'});
    if(!yes)return;
    try{
      const r=await api('/api/adopt-playlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:t.fn_user,guid:t.guid,keep_existing:true,sources:[{platform:s.platform,id:s.pid}]})});
      await renderMerge();setCard(t.fn_user,r.name,{state:'queued',pct:0,step:'准备中'});paintWires();
      await autoPack(t.fn_user,r.name);refreshSoon();toast(`已接入「${r.name}」`);mergeRunSoon(t.fn_user,r.name);
    }catch(e){gAlert('接入失败',esc(e.message));}
    return;
  }

  // 拖到它自己那张歌单上：本来就是一对一映射，连了也没有任何意义，
  // 而且以前会在这里造出一个「只有 1 个来源的融合组」这种畸形数据
  if ((t.sources || []).length === 1 && t.sources[0] === sid)
    return toast(`「${t.name}」本来就是由「${s.name}」同步来的，不用再连`);

  const gs = cloneMerges();
  const gi = gs.findIndex(g => g.fn_user === t.fn_user && g.name === t.name);
  if (gi < 0) {
    // 目标原本是「一对一同步」的歌单 —— 连上去就等于把它升级成融合组。
    // 拖线本身就是「我确定」的意思，不再弹框确认。
    const others = (t.sources || []).map(id => GR.byS[id]).filter(Boolean);
    gs.push({fn_user: t.fn_user, name: t.name,
             sources: others.map(o => ({platform: o.platform, id: o.pid}))
               .concat([{platform: s.platform, id: s.pid}])});
  } else {
    const g = gs[gi];
    g.sources = (g.sources || []).slice();
    if (g.sources.some(x => x.platform === s.platform && String(x.id) === String(s.pid)))
      return toast(`「${s.name}」已经在「${t.name}」里了`);
    g.sources.push({platform: s.platform, id: s.pid});
  }
  try {
    const r = await saveMerges(gs);
    await renderMerge();
    setCard(t.fn_user,t.name,{state:'queued',pct:0,step:'准备中'});paintWires();
    if (!reclaimNote(r)) {
      if (r && r.dropped && r.dropped.length)
        toast('已移除重复连接，正在融合…');
      else
        toast(`已把「${s.name}」连到「${t.name}」，正在融合…`);
    }
    await autoPack(t.fn_user, t.name);
    mergeRunSoon(t.fn_user,t.name);
  } catch(e) { gAlert('连接失败', esc(e.message)); }
}

/* ---------- 平台上已经删掉的来源：一键摘掉 ---------- */
async function dropMissingSource(s){
  const targets = (s.targets || []).slice();
  if (!targets.length) return;
  const names = targets.map(t => t.split('|').slice(1).join('|'));
  const yes = await gAsk({title: `从融合中移除「${s.name}」？`,
    html: `它将不再参与 ${names.length} 个融合歌单。`,
    ok: '移除', cancel: '取消', danger: true});
  if (!yes) return;
  let n = 0;
  for (const name of names) {
    try {
      await api('/api/cut-link', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({user: s.fn_user, name,
                              platform: s.platform, id: s.pid})});
      n++;
    } catch(e) { gAlert('摘掉失败', esc(e.message)); break; }
  }
  if (n) { await load(); toast(`已摘掉：「${s.name}」不再参与融合`); }
}

/* ---------- 断开一根连线 ---------- */

        + `</div><div class="g-ok">飞牛音乐里已有的歌单不会被删除，`
        + `下次「一键维护」按剩下的来源重建它。</div>`,
      ok: '断开连线', cancel: '取消', danger: true});

    ok: '断开', cancel: '取消', danger: true});

/* 改配置就生效，不再弹框问 —— 直接排一次融合，进度在底部任务栏 */

/* ---------- 拖拽调整顺序（左右位置不变，只改前后） ---------- */
/* 用元素在**屏幕上的真实位置**来算顺序 —— 不再自己做「内容坐标 ↔ 屏幕坐标」
   的换算，避免缩放/平移/页头高度任何一项对不上就全错 */
function reorderNodes(kind){
  const sel = kind === 'src' ? '.g-node.left' : '.g-node.right';
  const vp = $('#viewport');
  return Array.from(vp.querySelectorAll(sel)).map(n => {
    const r = n.getBoundingClientRect();
    return {n: n, id: n.dataset.src || n.dataset.tgt,
            top: r.top, mid: r.top + r.height / 2, h: r.height};
  }).sort((a, b) => a.mid - b.mid);
}
/* 各节点的屏幕中线：只在「布局代次」变了之后才重量一次。
   以前每次 mousemove 都把几十个节点 getBoundingClientRect() 一遍，
   那是强制同步重排 —— 鼠标一动就掉帧，所以拖着不跟手。 */
function reorderMids(kind){
  const c = GR.midCache;
  if (c && c.kind === kind && c.stamp === GR.stamp) return c.list;
  const list = reorderNodes(kind).map(x => ({id: x.id, mid: x.mid}));
  GR.midCache = {kind: kind, stamp: GR.stamp, list: list};
  return list;
}
/* 被拖的那张卡片自己的连线要跟着卡片走，不然线还挂在原来那一行上，看着像断了 */
function followWires(id, kind, cy){
  const map = GR.wireEl || {}, yc = GR.rowYc || {};
  Object.keys(map).forEach(k => {
    const i = k.indexOf('|');
    const sid = k.slice(0, i), tid = k.slice(i + 1);
    if (kind === 'src' ? sid !== id : tid !== id) return;
    const y1 = kind === 'src' ? cy : yc[sid];
    const ty = GR.tgtY[tid];
    const y2 = kind === 'tgt' ? cy : (ty == null ? null : ty + NODE_H / 2);
    if (y1 == null || y2 == null) return;
    const d = wireD(y1, y2);
    map[k].p.setAttribute('d', d);
    map[k].hit.setAttribute('d', d);
  });
}
/* 把可见范围内的新顺序摊回全局顺序 */
function expandOrder(kind, vis){
  const all = globalOrder(kind);
  const visSet = new Set(vis);
  const slots = [];
  all.forEach((id, i) => { if (visSet.has(id)) slots.push(i); });
  const out = all.slice();
  slots.forEach((pos, k) => { out[pos] = vis[k]; });
  return out;
}
function updateReorder(clientY){
  GR.lastY = clientY;
  const dragId = GR.reorder.id;
  const kind = GR.reorder.kind;
  const list = reorderMids(kind).filter(x => x.id !== dragId);
  // 直接拿鼠标的屏幕 y 和各节点的屏幕中线比 —— 纯屏幕坐标，谁也不用换算
  let at = list.findIndex(x => clientY < x.mid);
  if (at < 0) at = list.length;
  if ($('#graph-wrap').classList.contains('debug')) {
    const sr = $('#stage').getBoundingClientRect();
    dbg(`指针 clientY=${Math.round(clientY)}  stage.top=${Math.round(sr.top)}\n`
      + `scale=${GR.scale.toFixed(3)}  ty=${Math.round(GR.ty)}\n`
      + `节点数=${list.length}  落点 at=${at}\n`
      + `上方节点 mid=${list[0] ? Math.round(list[0].mid) : '-'}  `
      + `下方 mid=${list.length ? Math.round(list[list.length - 1].mid) : '-'}`);
  }
  // 实时让位：插到哪儿，其它歌单就先挪开，跟手机列表排序一样。
  // 这里走 relayoutFast —— 不新建/不删除任何元素，所以连线一直都在
  if (at !== GR.reorder.at) {
    GR.reorder.at = at;
    const vis = list.map(x => x.id);
    vis.splice(at, 0, dragId);
    GR.preview = {};
    GR.preview[kind === 'src' ? 'sources' : 'targets'] = expandOrder(kind, vis);
    relayoutFast();
  }
  // 被拖的那张卡片跟着鼠标走（屏幕坐标 → 内容坐标只在这一处换算）
  const cur = kind === 'src' ? GR.L[dragId] : GR.R[dragId];
  const r = GR.stageRect || (GR.stageRect = $('#stage').getBoundingClientRect());
  const cy = (clientY - r.top - GR.ty) / GR.scale;
  if (cur) {
    cur.classList.add('moving');
    cur.style.top = (cy - NODE_H / 2) + 'px';
    cur.style.zIndex = 20;
  }
  followWires(dragId, kind, cy);       // 它的连线跟着一起走
  // 拖到上下边缘就慢慢滚，不然永远够不到列表外
  const ZONE = 90;
  let e = 0;
  if (clientY < r.top + ZONE) e = -((r.top + ZONE - clientY) / ZONE);
  else if (clientY > r.bottom - ZONE) e = ((clientY - (r.bottom - ZONE)) / ZONE);
  GR.edge = Math.max(-1, Math.min(1, e));
  if (GR.edge && !GR.edgeRAF) GR.edgeRAF = requestAnimationFrame(edgeScrollStep);
}
async function endReorder(){
  const kind = (GR.reorder && GR.reorder.kind) || 'src';
  const key = kind === 'src' ? 'sources' : 'targets';
  const out = GR.preview && GR.preview[key];
  const before = globalOrder(kind);
  GR.edge = 0;
  if (GR.edgeRAF) { cancelAnimationFrame(GR.edgeRAF); GR.edgeRAF = null; }
  $('#stage').classList.remove('reordering');
  dbg(null);
  GR.reorder = null;
  GR.clickOk = false;
  GR.midCache = null;
  GR.stageRect = null;
  GR.preview = null;
  if (!out) { redrawOnly(); return; }      // 没挪动，原样重画
  // 先在本地落定：松手这一刻界面就已经是最终样子，
  // 不刷新、不重新适配缩放 —— 所以不会「停一下才完成」
  G.order_cfg = G.order_cfg || {};
  G.order_cfg[key] = out;
  redrawOnly();
  api('/api/save-order', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(kind === 'src' ? {sources: out, targets: savedOrder('targets')}
                                          : {sources: savedOrder('sources'), targets: out})})
    .then(() => toast('顺序已保存'))
    .catch(e => {                          // 存不上就把画面退回原来的顺序
      G.order_cfg[key] = before;
      redrawOnly();
      gAlert('保存顺序失败', esc(e.message));
    });
}
/* 全局顺序 = 已保存的顺序（去掉不存在的）+ 剩下的按当前次序补在后面 */
function globalOrder(kind){
  const all = kind === 'src' ? (G.sources || []).map(s => s.id)
                             : (G.targets || []).map(t => t.id);
  const saved = savedOrder(kind === 'src' ? 'sources' : 'targets');
  const seen = new Set(), out = [];
  saved.forEach(id => { if (all.indexOf(id) >= 0 && !seen.has(id)) { out.push(id); seen.add(id); } });
  all.forEach(id => { if (!seen.has(id)) { out.push(id); seen.add(id); } });
  return out;
}

function bindGraph(){
  const stage = $('#stage');
  stage.addEventListener('mousedown', e => {
    if (e.target.closest('.zoombar,.g-selbar,.g-modal,.g-legend')) return;
    // 就地改名时那个输入框要能正常点进去、点哪儿光标就落哪儿
    if (e.target.closest('input,textarea,select')) return;
    // 正在改名时点别处 → 直接当作「改完了」
    if (GR.renameFinish) { const f = GR.renameFinish; GR.renameFinish = null; f(true); }
    e.preventDefault();          // 别让浏览器开始选文本 / 拖图标
    // 只有按住来源节点右边缘的小圆点才连线；节点本体拖动 = 调整顺序
    const port = e.target.closest('.g-node.left .port');
    const node = port ? port.closest('.g-node.left') : null;
    GR.dragRow = node ? +node.dataset.row : null;
    const anyNode = e.target.closest('.g-node.left,.g-node.right');
    GR.reorder = (!port && anyNode) ? {el: anyNode, y0: e.clientY, on: false} : null;
    GR.dragging = true; GR.moved = 0;
    GR.lastX = e.clientX; GR.lastY = e.clientY;
    GR.sx = e.clientX - GR.tx; GR.sy = e.clientY - GR.ty;
    GR.dragSrc = node ? node.dataset.src : null;
    stage.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!GR.dragging) return;
    GR.moved += Math.abs(e.clientX - GR.lastX) + Math.abs(e.clientY - GR.lastY);
    GR.lastX = e.clientX; GR.lastY = e.clientY;
    if (GR.dragSrc && !GR.dragActive && GR.moved > 6) beginConnect(GR.dragSrc);
    if (GR.dragActive) { updateConnect(e.clientX, e.clientY); return; }
    if (GR.reorder && !GR.reorder.on && Math.abs(e.clientY - GR.reorder.y0) > 6) {
      GR.reorder.on = true;
      // 拖拽一开始就把「被拖的是谁、往哪边排」记死，
      // 中途就算整体重画也不怕元素被换掉
      const el = GR.reorder.el;
      GR.reorder.kind = el.dataset.src ? 'src' : 'tgt';
      GR.reorder.id = el.dataset.src || el.dataset.tgt;
      GR.reorder.at = null;
      GR.midCache = null;
      GR.stageRect = $('#stage').getBoundingClientRect();   // 拖拽期间舞台不会动，量一次就够
      el.classList.add('moving');
      el.style.zIndex = 20;
      $('#stage').classList.add('reordering');
    }
    if (GR.reorder && GR.reorder.on) { updateReorder(e.clientY); return; }
    GR.tx = e.clientX - GR.sx; GR.ty = e.clientY - GR.sy;
    applyT(true);                    // 拖拽时不受「按宽度铺满」的限制
  });
  window.addEventListener('mouseup', e => {
    if (GR.reorder && GR.reorder.on) endReorder();
    else if (GR.dragActive) endConnect(e.clientX, e.clientY);
    else if (GR.dragging) GR.clickOk = GR.moved < 5;
    GR.dragging = false; GR.dragSrc = null;
    stage.classList.remove('dragging');
  });
  stage.addEventListener('click', e => {
    if (e.target.closest('.g-node,.g-modal,.g-selbar,.zoombar') || !GR.clickOk) return;
    if (!GR.sel.size) return;
    clearSel();
  });
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    // 有些浏览器是按「行」报的
    const k = e.deltaMode === 1 ? 18 : 1;
    const dy = e.deltaY * k, dx = e.deltaX * k;
    if (e.ctrlKey || e.metaKey) {
      // Ctrl / ⌘ + 滚轮 = 缩放（鼠标党也能用），以光标为中心
      const ns = Math.max(GR.minScale, Math.min(3, GR.scale * (dy < 0 ? 1.12 : 1 / 1.12)));
      const r = stage.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      GR.tx = mx - (mx - GR.tx) * (ns / GR.scale);
      GR.ty = my - (my - GR.ty) * (ns / GR.scale);
      GR.scale = ns;
    } else {
      // 默认：上下滑动（触控板横向也能滑）
      GR.ty -= dy; GR.tx -= dx;
    }
    applyT();
  }, {passive:false});
  window.addEventListener('resize', () => { GR.stageRect = null; if (G) fitGraph(); });
  // 页面一滚，拖拽时缓存的舞台位置就不准了
  window.addEventListener('scroll', () => { GR.stageRect = null; }, true);
  // 画布支持滚轮平移/缩放，无需额外缩放按钮。
  // 点弹窗外面才关。必须**按下和松开都在外面** —— 否则在框里拖一下鼠标
  // （选个字、挪一下）手滑松到外面，填了一半的表单就没了
  $('#g-modal').addEventListener('mousedown', e => {
    GR.modalDown = {x: e.clientX, y: e.clientY, self: e.target.id === 'g-modal'};
  });
  $('#g-modal').addEventListener('click', e => {
    if (e.target.id !== 'g-modal') return;
    const d = GR.modalDown;
    if (d && !d.self) return;         // 是从框里按下去的 → 手滑松到外面也不算「点外面」
    if (d && (Math.abs(e.clientX - d.x) + Math.abs(e.clientY - d.y)) > 6) return;
    closeModal();                     // 从空白处按下、原地松开 = 真的是点外面
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#g-modal').classList.contains('on')) closeModal();
  });
}

/* ---------- 选择与操作 ---------- */
function toggleSel(sid){
  if (GR.sel.has(sid)) GR.sel.delete(sid); else GR.sel.add(sid);
  GR.focus = null;
  Object.keys(GR.R).forEach(k => GR.R[k].classList.remove('focus'));
  Object.keys(GR.L).forEach(k => GR.L[k].classList.toggle('sel', GR.sel.has(k)));
  renderSelbar();
}
function clearSel(){
  GR.sel.clear();
  Object.keys(GR.L).forEach(k => GR.L[k].classList.remove('sel'));
  renderSelbar();
}
function clearFocus(){
  GR.focus = null;
  Object.keys(GR.R).forEach(k => GR.R[k].classList.remove('focus'));
  renderSelbar();
}

function renderSelbar(){
  const bar = $('#selbar'), hint = $('#g-hint');
  if (GR.dragActive) return;
  if (!GR.sel.size) {
    bar.classList.remove('on'); bar.innerHTML = '';
    hint.textContent = '滚轮上下滑动 · Ctrl+滚轮缩放 · '
      + '拖小圆点连线 · 双击右侧歌单改名 · 拖空白处平移';
    return;
  }
  const gs = S.merges_cfg || [];
  bar.classList.add('on');
  bar.innerHTML = `<b>已选 ${GR.sel.size} 个来源</b>
    <select class="gsel" id="sel-go">
      <option value="">加入融合组…</option>
      ${gs.map((g, i) => `<option value="${i}">${esc(g.fn_user)} · ${esc(g.name)}</option>`).join('')}
      <option value="__new">＋ 新建融合组…</option>
    </select>
    <button class="g-btn" onclick="selRemove()">移出融合组</button>
    <button class="g-btn" onclick="clearSel()">清空</button>`;
  $('#sel-go').onchange = e => selInto(e.target.value);
  hint.textContent = `已选 ${GR.sel.size} 个来源 —— 选一个融合组把它们并进去`;
}

function runMerge(gi){
  const g = (S.merges_cfg || [])[gi];
  if (g) run('merge', g.fn_user);
}

let SRC_TARGET_ID = null;
document.addEventListener('click',e=>{
  if(e.target.closest('.g-node.right .more,.g-node.right .node-menu'))return;
  document.querySelectorAll('.g-node.right.menu-open').forEach(n=>{n.classList.remove('menu-open');const b=n.querySelector('.more');if(b)b.setAttribute('aria-expanded','false');});
});

async function handleTargetMenuAction(tid,action){
  const t=GR.byT[tid];if(!t)return;
  if(action==='add-source'){SRC_TARGET_ID=tid;openSrcForm(-1,tid);return;}
  if(action==='cancel-merge'){
    const gi=(S.merges_cfg||[]).findIndex(g=>g.fn_user===t.fn_user&&g.name===t.name);
    if(gi>=0)return cancelMerge(gi);
    const yes=await gAsk({title:`取消「${t.name}」的融合？`,html:'飞牛歌单会保留。',ok:'取消融合',danger:true});
    if(!yes)return;
    try{await api('/api/cancel-merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:t.fn_user,name:t.name})});await load();toast(`已取消融合：${t.name}`);}
    catch(e){gAlert('取消失败',esc(e.message));}
    return;
  }

function cloneMerges(){
  // 整份复制：keep_existing 之类的字段不能丢
  return (S.merges_cfg || []).map(g =>
    Object.assign({}, g, {sources: (g.sources || []).slice()}));
}

async function selInto(v){
  if (!v) return;
  if (v === '__new') return openGroupForm(true);
  const gs = cloneMerges();
  const g = gs[+v]; if (!g) return;
  const seen = new Set((g.sources || []).map(s => `${s.platform}:${s.id}`));
  const add = [...GR.sel].map(id => ({platform: GR.byS[id].platform, id: GR.byS[id].pid}))
    .filter(a => !seen.has(`${a.platform}:${a.id}`));
  if (!add.length)
    return gAlert('已经在了', `选中的来源都已经在「${esc(g.name)}」里了。`);
  g.sources = (g.sources || []).concat(add);
  const r = await saveMerges(gs);
  await renderMerge();setCard(g.fn_user,g.name,{state:'queued',pct:0,step:'准备中'});paintWires();
  if (!reclaimNote(r)) toast(`已向「${g.name}」添加 ${add.length} 个来源`);
  await autoPack(g.fn_user, g.name);
  mergeRunSoon(g.fn_user,g.name);
}
async function selRemove(){
  const gs = cloneMerges();
  let n = 0;
  gs.forEach(g => {
    const before = g.sources.length;
    g.sources = g.sources.filter(s => !GR.sel.has(`${s.platform}:${s.id}`));
    n += before - g.sources.length;
  });
  if (!n) return gAlert('没有可移出的来源',
    '选中的来源不在任何融合组里。<br>表格形式的「一对一同步」映射请到「歌单同步」页调整。');
  const r = await saveMerges(gs);
  await renderMerge();
  refreshSoon();
  reclaimNote(r);
}
async function cancelMerge(gi){
  const g = (S.merges_cfg || [])[gi]; if (!g) return;

    html: '飞牛歌单会保留。', ok: '取消融合', danger: true});
  if (!yes) return;
  try {
    await api('/api/cancel-merge', {method:'POST',

}
async function saveMerges(gs){
  const r = await api('/api/save-merges', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({merges: gs})});
  GR.sel.clear();
  return r || {};
}

/* ---------- 连线即生效：不再弹框问，直接排一次融合 ---------- */
/* 连着拖好几条线时只跑一次；跑到一半又改了，就跑完再补一次 */
let mergeBusy = false, mergePending = [];
function mergeRunSoon(user,groupName){
  const req={user:user||null,group:groupName||null};
  if(mergeBusy){if(!mergePending.some(x=>x.user===req.user&&x.group===req.group))mergePending.push(req);return;}
  mergeBusy=true;
  Promise.resolve(run('merge',req.user,null,req.group)).catch(()=>{}).finally(()=>{
    mergeBusy=false;const next=mergePending.shift();if(next)mergeRunSoon(next.user,next.group);
  });
}
/* 服务端顺手收掉了成员自己那张多余的单独歌单 —— 用轻提示说一声，不弹框 */
function reclaimNote(r){
  const rc = (r && r.reclaim) || {};
  const failed = rc.failed || [];
  if ((r && r.reclaim_error) || failed.length) {
    toast('融合已保存，旧歌单清理失败，请重试');
    return true;
  }
  const del = rc.deleted || [];
  if (!del.length) return false;
  toast(`已清理 ${del.length} 个旧歌单`);
  return true;
}

/* ---------- 双击右侧歌单：就地改名 ---------- */
function inlineRename(tid){
  const t = GR.byT[tid], n = GR.R[tid];
  if (!t || !n || n.classList.contains('editing')) return;
  clearHot();
  const old = t.name;
  n.classList.add('editing');
  n.innerHTML = `<span class="dot"></span>`
    + `<input class="rn-in" value="${esc(old)}" spellcheck="false">`
    + `<span class="rn-err"></span>`;
  const inp = n.querySelector && n.querySelector('.rn-in');
  const err = n.querySelector && n.querySelector('.rn-err');
  if (!inp) { n.classList.remove('editing'); return; }
  inp.focus();
  if (inp.select) inp.select();
  let done = false;
  const finish = async commit => {
    if (done) return;
    done = true;
    GR.renameFinish = null;
    const v = (inp.value || '').trim();
    if (!commit || !v || v === old) {
      n.classList.remove('editing');
      await load();                       // 还原成正常节点
      return;
    }
    inp.disabled = true;
    try {
      const r = await api('/api/rename-playlist', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({user: t.fn_user, guid: t.guid, old: old, name: v})});
      n.classList.remove('editing');
      await load();
      if (r.changed) {
        const k = r.touched || {};
        toast(`已改名：「${r.old}」→「${r.new}」`
          + `（融合组 ${k.merges || 0} · 配置 ${k.accounts || 0} · 台账 ${k.prov || 0}）`);
      }
    } catch(e) {
      done = false;                       // 留在编辑态，让用户改完再试
      inp.disabled = false;
      if (err) err.textContent = e.message;
      inp.focus();
    }
  };
  GR.renameFinish = finish;          // 点页面任何空白处也会提交
  inp.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
  inp.onblur = () => finish(true);
}

/* ---------- 进度：后端 @@P 行 → 卡片上的进度条 ---------- */
/* 后端会打 @@P {"scope":"merge","name":"影视配乐","step":"写入","pct":61} 这样的行。
   前端把它吃掉、不写进日志框，然后画到对应那张飞牛歌单卡片上。
   没有真实计数的那一段 pct 就是 null —— 用流光表示「在动，但不知道还有多久」，
   不假装知道百分比。 */
const PROG_PREFIX = '@@P ';
const ACTION_CN = {merge: '融合', sync: '同步', refresh: '刷新', update: '一键维护',
                   doctor: '环境自检', backup: '备份', scan: '扫库', missing: '待补清单',
                   library: '导出曲库'};

function cardTid(user, name){ return (user || '') + '|' + name; }
function cardColor(tid){
  const t = GR.byT[tid];
  const merged = t && (t.kind === 'merge' || (t.sources || []).length > 1);
  return merged ? (GR.gcolor[tid] || '#ffb454') : '#4d8dff';
}
function cardSub(tid, st){
  const t = GR.byT[tid];
  if (!t) return '';
  const unt = t.kind === 'untracked';
  const base = `${t.count} 首`;
  if (st && st.state === 'run')
    return `${base} · ${st.step || '处理中'}`
      + (st.pct == null ? '…' : ` ${Math.round(st.pct)}%`);
  if (st && st.state === 'queued') return `${base} · 排队中`;
  if (st && st.state === 'done') return `${base} · ✓ 已完成`;
  if (st && st.state === 'fail') return `${base} · ✗ 出错`;
  return base + (unt ? '' : (t.synced ? '' : ' · 未同步'));
}
/* 把某张卡片的状态画出来（只动这一张，不整体重画 —— 不然拖拽会打架） */
function paintCard(tid){
  const n = GR.R[tid], t = GR.byT[tid];
  if (!n || !t) return;
  const st = GR.cards[tid];
  const col = cardColor(tid);
  const sub = n.querySelector('.sub');
  if (sub) {
    sub.textContent = cardSub(tid, st);
    sub.classList.toggle('pgsub', !!st);
    sub.onclick = st ? ev => {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      openJobs();
    } : null;
  }
  let bar = n.querySelector('.pg');
  if (st) {
    if (!bar) {                       // 在 .sub 之后插，别打乱原有布局
      bar = document.createElement('span');
      bar.className = 'pg';
      bar.innerHTML = '<i></i>';
      n.appendChild(bar);
    }
    bar.classList.toggle('indet', st.state === 'run' && st.pct == null);
    const i = bar.querySelector('i');
    if (i) {
      i.style.width = (st.state === 'queued' ? 0
        : (st.pct == null ? 34 : Math.max(0, Math.min(100, st.pct)))) + '%';
      i.style.background = col;
      i.style.boxShadow = `0 0 6px ${col}`;
    }
    const live = st.state === 'run';
    n.classList.toggle('busy', live);
    n.style.borderColor = st.state === 'run' ? col : (st.state === 'fail' ? '#ff7a8a' : '');
    n.style.boxShadow = live
      ? `0 0 0 1px ${col},0 8px 26px -10px ${col}` : '';
  } else if (bar) {
    bar.remove();
    n.classList.remove('busy');
    n.style.borderColor = '';
    n.style.boxShadow = '';
  }
}
/* 走线的速度：正在融合的那几根流得快一点 */
function paintWires(){
  const run = new Set(Object.keys(GR.cards).filter(k => GR.cards[k].state === 'run'));
  Object.keys(GR.wireEl || {}).forEach(k => {
    const tid = k.slice(k.indexOf('|') + 1);
    GR.wireEl[k].p.classList.toggle('busy', run.has(tid));
  });
}
/* 整张图重画之后（buildNodes 会把节点换掉），按状态重新贴一遍 */
function paintAllProg(){
  const tids = Object.keys(GR.cards);
  if (!tids.length) return;
  tids.forEach(paintCard);
  paintWires();
}
function setCard(user, name, st){
  const tid = cardTid(user, name);
  if (!GR.R[tid]) return;               // 不在当前账户视图里，不用画
  GR.cards[tid] = Object.assign(GR.cards[tid] || {}, st);
  paintCard(tid);
}
function applyProg(s){
  let p; try { p = JSON.parse(s); } catch(e) { return; }
  if (!GR.job) GR.job = {};
  ['scope', 'i', 'n', 'step', 'pct', 'user', 'name', 'done',
   'platform', 'pid'].forEach(k => {
    if (k in p) GR.job[k] = p[k];
  });
  GR.job.running = true;
  if (Array.isArray(p.plan)) {
    GR.plan = p.plan;
    p.plan.forEach(it => setCard(it.user, it.name, {state: 'queued', pct: 0}));
  }
  if (GR.plan) {                        // 排在它前面的都算跑完了
    const k = Math.max(0, (p.i || 1) - 1);
    GR.plan.forEach((it, idx) => {
      const st = GR.cards[cardTid(it.user, it.name)];
      if (p.done || idx < k) setCard(it.user, it.name, {state: 'done', pct: 100});
      else if (idx === k && p.name && it.name !== p.name && st && st.state === 'queued')
        setCard(it.user, it.name, {state: 'done', pct: 100});
    });
  }
  if (p.name) {
    setCard(p.user, p.name, p.done
      ? {state: 'done', pct: 100}
      : {state: 'run', step: p.step, pct: (p.pct == null ? null : p.pct)});
  }
  paintWires();          // 正在融合的那几根线要流得快一点
  paintJobBtn();
  paintListProg();
  setJobIco();
}
/* 任务结束：先让卡片亮个「✓」，过两秒再收干净，回到「· 未同步」 */
function finishProg(code){
  const bad = code != null && code !== 0;
  GR.progDone = {code: code};
  const tids = Object.keys(GR.cards);
  tids.forEach(tid => {
    GR.cards[tid] = {state: bad ? 'fail' : 'done', pct: 100};
    paintCard(tid);
  });
  paintWires();
  paintJobBtn();
  paintListProg();
  const wait = bad ? 8000 : 2200;
  setTimeout(() => {
    if (GR.job && GR.job.running) return;      // 又开跑了就别清
    clearProg();
  }, wait);
}
function clearProg(){
  GR.cards = {}; GR.plan = null; GR.job = null; GR.progDone = null;
  Object.keys(GR.R).forEach(paintCard);
  paintWires();
  paintJobBtn();
  paintListProg();
  setJobIco();
}
/* 页面级任务：让点下去的那个按钮自己变成进度条 */
function paintJobBtn(){
  const b = GR.jobBtn;
  if (!b) return;
  if (!b.dataset.label) b.dataset.label = (b.textContent || '').trim() || '执行';
  const on = !!(GR.job && GR.job.running);
  const j = GR.job || {};
  if (!on) {
    b.classList.remove('running');
    b.textContent = b.dataset.label;
    return;
  }
  const name = ACTION_CN[j.action] || j.action || '执行';
  const step = j.step ? ` · ${j.step}` : '';
  const pct = (j.pct == null ? '' : ` ${Math.round(j.pct)}%`);
  b.classList.add('running');
  b.textContent = `${name}${step}${pct}`;
  let bar = b.querySelector ? b.querySelector('.bpg') : null;
  if (!bar) { bar = document.createElement('i'); bar.className = 'bpg'; b.appendChild(bar); }
  bar.classList.toggle('indet', j.pct == null);
  if (j.pct != null) bar.style.width = Math.max(0, Math.min(100, j.pct)) + '%';
  else bar.style.width = '';
}

async function run(action, user, btn, groupName){
  if (GR.job && GR.job.running) { openJobs(); return null; }   // 已经在跑，点一下看日志
  const bar = $('#jobbar'), log = $('#job-log');
  GR.job = {action, user, group:groupName||null, running: true, step: groupName?'准备中':'', pct: null, i: 0, n: 0};
  GR.cards = groupName ? {[cardTid(user,groupName)]:{state:'queued',pct:0,step:'准备中'}} : {};
  GR.plan = null; GR.progDone = null;
  GR.jobBtn = btn || null;
  paintListProg();
  log.textContent = '';
  $('#job-title').textContent = '执行中：fnsync ' + action + (user ? ' --user ' + user : '') + (groupName ? ' --group ' + groupName : '');
  paintJobBtn(); setJobIco();
  let code = null;
  try {
    // 必须带上 CSRF 头：P3 之后所有管理写接口都受鉴权中间件保护，
    // 漏了这个头会直接 401，老的「执行」按钮会莫名其妙失效。
    const r = await fetch('/api/run', {method:'POST',
      headers:{'Content-Type':'application/json',
               'X-Bridge-CSRF': (typeof SESSION !== 'undefined' && SESSION.csrf) || ''},
      body: JSON.stringify({action, user, ...(groupName ? {group:groupName} : {})})});
    if (r.status === 401){
      log.textContent = '⚠️ 未登录或会话已过期 —— 请在顶部登录后再执行（管理写操作已受保护）';
      if (typeof loadSession === 'function') loadSession();
      $('#job-title').textContent = '未登录，未执行';
      paintJobBtn();
      return;
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const x = await rd.read();
      if (x.done) break;
      dec.decode(x.value).split('\n').forEach(l => {
        if (!l.startsWith('data: ')) return;
        let j; try { j = JSON.parse(l.slice(6)); } catch(e) { return; }
        const line = j.line == null ? '' : j.line;
        if (line.indexOf(PROG_PREFIX) === 0) {      // 进度行不进日志框
          applyProg(line.slice(PROG_PREFIX.length));
          return;
        }
        buf += line + '\n';
        if (j.done) code = (j.code == null ? 0 : j.code);
      });
      log.textContent = buf;
      log.scrollTop = log.scrollHeight;
    }
    $('#job-title').textContent = (code ? '执行失败（退出码 ' + code + '）'
                                        : '执行完成') + '：fnsync ' + action;
    if (code) $('#job-title').style.color = '#ff9aa4';
  } catch(e) {
    code = -1;
    buf += `\n[前端] 任务没能跑起来：${e && e.message}\n`;
    log.textContent = buf;
    $('#job-title').textContent = '执行失败：fnsync ' + action;
    $('#job-title').style.color = '#ff9aa4';
  }
  if (!code) $('#job-title').style.color = '';
  GR.job.running = false;
  finishProg(code);
  setJobIco();
  // 日志面板只由用户主动打开，操作完成或失败都不自动弹出。
  await load();
  return code;
}

initToolbar();
bindGraph();
load();
</script></body></html>
